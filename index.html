<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const PUBLIC_SHEET_ID =
  "1PGb7g244LFMqlqJdJWDGaeGsZzJsel9WTUakDcNatiQ";

const FACILITIES_SHEET =
  "Facilities";

const BOOKINGS_SHEET =
  "Bookings";

const GOOGLE_FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSdja_U2aFCea0GAL6qZdaUxG5viyi4AlC-zROude_yzXAFIWg/viewform";

const FORM_FIELDS = {

  facility:
    "entry.1139525746",

  date:
    "entry.482205338",

  start:
    "entry.1117912077",

  end:
    "entry.866972168"

};


/* =========================================================
   STATE
========================================================= */

let facilities = [];

let bookings = [];

let selectedFacility = null;

let selectedDate = null;

let selectedStartTime = null;

let selectedEndTime = null;


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    setMinimumDate();

    loadFacilities();

  }
);


/* =========================================================
   DATE SETUP
========================================================= */

function setMinimumDate() {

  const input =
    document.getElementById(
      "bookingDate"
    );

  const today =
    new Date();

  input.min =
    formatDateForInput(
      today
    );

}


function formatDateForInput(
  date
) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================================================
   GOOGLE SHEETS GVIZ
========================================================= */

async function fetchGviz(
  sheetName
) {

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    PUBLIC_SHEET_ID +
    "/gviz/tq?sheet=" +
    encodeURIComponent(
      sheetName
    ) +
    "&tqx=out:json";

  const response =
    await fetch(
      url
    );

  if (
    !response.ok
  ) {

    throw new Error(
      "Google Sheet could not be accessed."
    );

  }

  const text =
    await response.text();

  const start =
    text.indexOf("(");

  const end =
    text.lastIndexOf(")");

  if (
    start === -1 ||
    end === -1
  ) {

    throw new Error(
      "Invalid Google Sheet response."
    );

  }

  const jsonText =
    text.substring(
      start + 1,
      end
    );

  return JSON.parse(
    jsonText
  );

}


/* =========================================================
   GVIZ CELL VALUE
========================================================= */

function getCellValue(
  cell
) {

  if (!cell) {
    return "";
  }

  if (
    cell.f !== undefined &&
    cell.f !== null
  ) {

    return String(
      cell.f
    ).trim();

  }

  if (
    cell.v !== undefined &&
    cell.v !== null
  ) {

    return String(
      cell.v
    ).trim();

  }

  return "";

}


/* =========================================================
   LOAD FACILITIES
========================================================= */

async function loadFacilities() {

  const loading =
    document.getElementById(
      "facilityLoading"
    );

  const error =
    document.getElementById(
      "facilityError"
    );

  const grid =
    document.getElementById(
      "facilityGrid"
    );

  loading.classList.remove(
    "hidden"
  );

  error.classList.add(
    "hidden"
  );

  grid.innerHTML =
    "";

  try {

    const data =
      await fetchGviz(
        FACILITIES_SHEET
      );

    facilities =
      parseFacilities(
        data.table
      );

    if (
      facilities.length === 0
    ) {

      throw new Error(
        "No facilities were found."
      );

    }

    renderFacilities();

    loading.classList.add(
      "hidden"
    );

  }

  catch (err) {

    console.error(
      "Facility loading error:",
      err
    );

    loading.classList.add(
      "hidden"
    );

    error.textContent =
      "Failed to load facilities. " +
      err.message;

    error.classList.remove(
      "hidden"
    );

  }

}


/* =========================================================
   PARSE FACILITIES

   PUBLIC SHEET:

   A = Facility
   B = Opening Time
   C = Closing Time
========================================================= */

function parseFacilities(
  table
) {

  const result = [];

  if (
    !table ||
    !table.rows
  ) {

    return result;

  }

  table.rows.forEach(
    row => {

      if (
        !row ||
        !row.c
      ) {

        return;

      }

      const facility =
        getCellValue(
          row.c[0]
        );

      const openingRaw =
        getCellValue(
          row.c[1]
        );

      const closingRaw =
        getCellValue(
          row.c[2]
        );

      if (
        !facility ||
        facility.toLowerCase() ===
        "facility"
      ) {

        return;

      }

      const openingTime =
        normalizeTime(
          openingRaw
        );

      const closingTime =
        normalizeTime(
          closingRaw
        );

      if (
        !openingTime ||
        !closingTime
      ) {

        console.warn(
          "Skipping facility with invalid time:",
          facility
        );

        return;

      }

      result.push({

        facility:
          facility,

        openingTime:
          openingTime,

        closingTime:
          closingTime

      });

    }
  );

  return result;

}


/* =========================================================
   RENDER FACILITIES
========================================================= */

function renderFacilities() {

  const grid =
    document.getElementById(
      "facilityGrid"
    );

  grid.innerHTML =
    "";

  facilities.forEach(
    facility => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "facility-card";

      card.innerHTML = `

        <h3>
          ${escapeHtml(
            facility.facility
          )}
        </h3>

        <div class="facility-hours">

          ${formatTime(
            facility.openingTime
          )}

          –

          ${formatTime(
            facility.closingTime
          )}

        </div>

        <div class="view-link">
          View availability →
        </div>

      `;

      card.onclick =
        () => openFacility(
          facility
        );

      grid.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   OPEN FACILITY
========================================================= */

function openFacility(
  facility
) {

  selectedFacility =
    facility;

  selectedDate =
    null;

  selectedStartTime =
    null;

  selectedEndTime =
    null;

  document
    .getElementById(
      "homePage"
    )
    .classList
    .remove(
      "active"
    );

  document
    .getElementById(
      "facilityPage"
    )
    .classList
    .add(
      "active"
    );

  document
    .getElementById(
      "selectedFacilityName"
    )
    .textContent =
    facility.facility;

  document
    .getElementById(
      "selectedFacilityHours"
    )
    .textContent =
    "Opening hours: " +
    formatTime(
      facility.openingTime
    ) +
    " – " +
    formatTime(
      facility.closingTime
    );

  const dateInput =
    document.getElementById(
      "bookingDate"
    );

  dateInput.value =
    "";

  const maxDate =
    new Date();

  maxDate.setDate(
    maxDate.getDate() + 30
  );

  dateInput.max =
    formatDateForInput(
      maxDate
    );

  document
    .getElementById(
      "availabilityInstruction"
    )
    .textContent =
    "Select a date to view available times.";

  document
    .getElementById(
      "availabilityLoading"
    )
    .textContent =
    "Select a date to view availability.";

  document
    .getElementById(
      "availabilityLoading"
    )
    .classList
    .remove(
      "hidden"
    );

  document
    .getElementById(
      "availabilityError"
    )
    .classList
    .add(
      "hidden"
    );

  document
    .getElementById(
      "availabilityMessage"
    )
    .classList
    .add(
      "hidden"
    );

  document
    .getElementById(
      "slotGrid"
    )
    .innerHTML =
    "";

  document
    .getElementById(
      "legend"
    )
    .classList
    .add(
      "hidden"
    );

  hideSelectionPanel();

}


/* =========================================================
   BACK HOME
========================================================= */

function goHome() {

  selectedFacility =
    null;

  selectedDate =
    null;

  selectedStartTime =
    null;

  selectedEndTime =
    null;

  document
    .getElementById(
      "facilityPage"
    )
    .classList
    .remove(
      "active"
    );

  document
    .getElementById(
      "homePage"
    )
    .classList
    .add(
      "active"
    );

}


/* =========================================================
   LOAD AVAILABILITY
========================================================= */

async function loadAvailability() {

  if (
    !selectedFacility
  ) {

    return;

  }

  const date =
    document
      .getElementById(
        "bookingDate"
      )
      .value;

  selectedDate =
    date;

  selectedStartTime =
    null;

  selectedEndTime =
    null;

  hideSelectionPanel();

  const loading =
    document.getElementById(
      "availabilityLoading"
    );

  const error =
    document.getElementById(
      "availabilityError"
    );

  const message =
    document.getElementById(
      "availabilityMessage"
    );

  const slotGrid =
    document.getElementById(
      "slotGrid"
    );

  const legend =
    document.getElementById(
      "legend"
    );

  slotGrid.innerHTML =
    "";

  error.classList.add(
    "hidden"
  );

  message.classList.add(
    "hidden"
  );

  legend.classList.add(
    "hidden"
  );

  if (!date) {

    loading.textContent =
      "Select a date to view availability.";

    loading.classList.remove(
      "hidden"
    );

    return;

  }

  loading.textContent =
    "Loading availability...";

  loading.classList.remove(
    "hidden"
  );

  try {

    const data =
      await fetchGviz(
        BOOKINGS_SHEET
      );

    bookings =
      parseBookings(
        data.table
      );

    renderAvailability();

    loading.classList.add(
      "hidden"
    );

    legend.classList.remove(
      "hidden"
    );

  }

  catch (err) {

    console.error(
      "Availability error:",
      err
    );

    loading.classList.add(
      "hidden"
    );

    error.textContent =
      "Failed to load availability. " +
      err.message;

    error.classList.remove(
      "hidden"
    );

  }

}


/* =========================================================
   PARSE BOOKINGS

   PUBLIC SHEET:

   A = Facility
   B = Date
   C = Start
   D = End
   E = Status
========================================================= */

function parseBookings(
  table
) {

  const result = [];

  if (
    !table ||
    !table.rows
  ) {

    return result;

  }

  table.rows.forEach(
    row => {

      if (
        !row ||
        !row.c
      ) {

        return;

      }

      const facility =
        getCellValue(
          row.c[0]
        );

      const dateRaw =
        getCellValue(
          row.c[1]
        );

      const startRaw =
        getCellValue(
          row.c[2]
        );

      const endRaw =
        getCellValue(
          row.c[3]
        );

      const status =
        getCellValue(
          row.c[4]
        ).toUpperCase();

      if (
        !facility ||
        facility.toLowerCase() ===
        "facility"
      ) {

        return;

      }

      if (
        status !== "PENDING" &&
        status !== "APPROVED"
      ) {

        return;

      }

      const date =
        normalizeDate(
          dateRaw
        );

      const start =
        normalizeTime(
          startRaw
        );

      const end =
        normalizeTime(
          endRaw
        );

      if (
        !date ||
        !start ||
        !end
      ) {

        console.warn(
          "Skipping invalid booking:",
          facility,
          dateRaw,
          startRaw,
          endRaw
        );

        return;

      }

      result.push({

        facility:
          facility,

        date:
          date,

        start:
          start,

        end:
          end,

        status:
          status

      });

    }
  );

  return result;

}


/* =========================================================
   RENDER AVAILABILITY
========================================================= */

function renderAvailability() {

  const slotGrid =
    document.getElementById(
      "slotGrid"
    );

  slotGrid.innerHTML =
    "";

  const openMinutes =
    timeToMinutes(
      selectedFacility.openingTime
    );

  const closeMinutes =
    timeToMinutes(
      selectedFacility.closingTime
    );

  if (
    isNaN(openMinutes) ||
    isNaN(closeMinutes)
  ) {

    throw new Error(
      "Invalid operating hours."
    );

  }

  for (
    let minutes = openMinutes;
    minutes < closeMinutes;
    minutes += 30
  ) {

    const slotEnd =
      minutes + 30;

    if (
      slotEnd > closeMinutes
    ) {

      break;

    }

    const status =
      getSlotStatus(
        selectedFacility.facility,
        selectedDate,
        minutes,
        slotEnd
      );

    const slot =
      document.createElement(
        "div"
      );

    slot.className =
      "slot " +
      status;

    slot.dataset.start =
      minutes;

    slot.dataset.end =
      slotEnd;

    slot.textContent =
      formatMinutes(
        minutes
      ) +
      " – " +
      formatMinutes(
        slotEnd
      );

    if (
      status === "available"
    ) {

      slot.onclick =
        () => handleSlotClick(
          minutes
        );

    }

    slotGrid.appendChild(
      slot
    );

  }

  if (
    slotGrid.children.length === 0
  ) {

    const message =
      document.getElementById(
        "availabilityMessage"
      );

    message.textContent =
      "No time slots are available for this facility.";

    message.classList.remove(
      "hidden"
    );

  }

}


/* =========================================================
   GET SLOT STATUS
========================================================= */

function getSlotStatus(
  facility,
  date,
  slotStart,
  slotEnd
) {

  const matchingBookings =
    bookings.filter(
      booking => {

        return (

          booking.facility ===
            facility &&

          booking.date ===
            date &&

          intervalsOverlap(

            slotStart,
            slotEnd,

            timeToMinutes(
              booking.start
            ),

            timeToMinutes(
              booking.end
            )

          )

        );

      }
    );

  if (
    matchingBookings.some(
      booking =>
        booking.status ===
        "APPROVED"
    )
  ) {

    return "booked";

  }

  if (
    matchingBookings.some(
      booking =>
        booking.status ===
        "PENDING"
    )
  ) {

    return "pending";

  }

  return "available";

}


/* =========================================================
   SLOT CLICK LOGIC

   FIRST CLICK:
   Choose START

   SECOND CLICK:
   Choose END
========================================================= */

function handleSlotClick(
  minutes
) {

  /* -----------------------------------------
     FIRST CLICK
  ----------------------------------------- */

  if (
    selectedStartTime === null
  ) {

    selectedStartTime =
      minutes;

    selectedEndTime =
      null;

    updateSlotVisuals();

    showStartSelection();

    return;

  }


  /* -----------------------------------------
     CLICK SAME SLOT
     = RESET
  ----------------------------------------- */

  if (
    minutes === selectedStartTime
  ) {

    selectedStartTime =
      null;

    selectedEndTime =
      null;

    updateSlotVisuals();

    hideSelectionPanel();

    document
      .getElementById(
        "availabilityInstruction"
      )
      .textContent =
      "Select a start time to begin your booking.";

    return;

  }


  /* -----------------------------------------
     CLICK EARLIER SLOT
     = MAKE IT NEW START
  ----------------------------------------- */

  if (
    minutes < selectedStartTime
  ) {

    selectedStartTime =
      minutes;

    selectedEndTime =
      null;

    updateSlotVisuals();

    showStartSelection();

    return;

  }


  /* -----------------------------------------
     SECOND CLICK
     = END TIME
  ----------------------------------------- */

  const possibleEnd =
    minutes + 30;

  /*
    Maximum booking duration = 4 hours.
  */

  if (
    possibleEnd -
    selectedStartTime >
    240
  ) {

    showTemporaryInstruction(
      "Maximum booking duration is 4 hours."
    );

    return;

  }

  /*
    Check entire range.
  */

  if (
    !isEntireIntervalAvailable(
      selectedStartTime,
      possibleEnd
    )
  ) {

    showTemporaryInstruction(
      "That range includes a booked or pending time. Please choose another end time."
    );

    return;

  }

  selectedEndTime =
    possibleEnd;

  updateSlotVisuals();

  showCompleteSelection();

}


/* =========================================================
   SHOW START SELECTION
========================================================= */

function showStartSelection() {

  const instruction =
    document.getElementById(
      "availabilityInstruction"
    );

  instruction.textContent =
    "Now select an end time. Maximum booking duration is 4 hours.";

  hideSelectionPanel();

}


/* =========================================================
   SHOW COMPLETE SELECTION
========================================================= */

function showCompleteSelection() {

  const duration =
    selectedEndTime -
    selectedStartTime;

  document
    .getElementById(
      "availabilityInstruction"
    )
    .textContent =
    "Your booking time is ready.";

  document
    .getElementById(
      "selectionTime"
    )
    .textContent =
    formatMinutes(
      selectedStartTime
    ) +
    " → " +
    formatMinutes(
      selectedEndTime
    );

  document
    .getElementById(
      "selectionDuration"
    )
    .textContent =
    formatDuration(
      duration
    );

  document
    .getElementById(
      "selectionHelp"
    )
    .textContent =
    "Click another time slot to change your selection.";

  document
    .getElementById(
      "selectionPanel"
    )
    .classList
    .remove(
      "hidden"
    );

}


/* =========================================================
   TEMPORARY INSTRUCTION
========================================================= */

function showTemporaryInstruction(
  message
) {

  const instruction =
    document.getElementById(
      "availabilityInstruction"
    );

  instruction.textContent =
    message;

}


/* =========================================================
   UPDATE SLOT VISUALS
========================================================= */

function updateSlotVisuals() {

  document
    .querySelectorAll(
      ".slot"
    )
    .forEach(
      slot => {

        slot.classList.remove(
          "start-selected",
          "end-selected",
          "range-selected",
          "range-blocked"
        );

      }
    );

  if (
    selectedStartTime === null
  ) {

    return;

  }

  const slots =
    document.querySelectorAll(
      ".slot"
    );

  slots.forEach(
    slot => {

      const start =
        Number(
          slot.dataset.start
        );

      const end =
        Number(
          slot.dataset.end
        );

      /*
        START
      */

      if (
        start ===
        selectedStartTime
      ) {

        slot.classList.add(
          "start-selected"
        );

      }

      /*
        COMPLETE RANGE
      */

      if (
        selectedEndTime !== null &&
        start >= selectedStartTime &&
        end <= selectedEndTime
      ) {

        slot.classList.add(
          "range-selected"
        );

      }

      /*
        END
      */

      if (
        selectedEndTime !== null &&
        end === selectedEndTime
      ) {

        slot.classList.remove(
          "range-selected"
        );

        slot.classList.add(
          "end-selected"
        );

      }

    }
  );

}


/* =========================================================
   CHECK ENTIRE INTERVAL
========================================================= */

function isEntireIntervalAvailable(
  start,
  end
) {

  return !bookings.some(
    booking => {

      if (
        booking.facility !==
        selectedFacility.facility
      ) {

        return false;

      }

      if (
        booking.date !==
        selectedDate
      ) {

        return false;

      }

      const bookingStart =
        timeToMinutes(
          booking.start
        );

      const bookingEnd =
        timeToMinutes(
          booking.end
        );

      return intervalsOverlap(
        start,
        end,
        bookingStart,
        bookingEnd
      );

    }
  );

}


/* =========================================================
   INTERVAL OVERLAP
========================================================= */

function intervalsOverlap(
  startA,
  endA,
  startB,
  endB
) {

  return (
    startA < endB &&
    endA > startB
  );

}


/* =========================================================
   HIDE SELECTION PANEL
========================================================= */

function hideSelectionPanel() {

  document
    .getElementById(
      "selectionPanel"
    )
    .classList
    .add(
      "hidden"
    );

}


/* =========================================================
   CONTINUE TO GOOGLE FORM
========================================================= */

function continueToForm() {

  if (
    !selectedFacility ||
    !selectedDate ||
    selectedStartTime === null ||
    selectedEndTime === null
  ) {

    alert(
      "Please select a complete booking time first."
    );

    return;

  }


  /*
    FINAL AVAILABILITY CHECK
  */

  if (
    !isEntireIntervalAvailable(
      selectedStartTime,
      selectedEndTime
    )
  ) {

    alert(
      "Sorry, this time is no longer available. Please choose another time."
    );

    loadAvailability();

    return;

  }


  /*
    Google Forms Time questions
    use 24-hour HH:MM format.
  */

  const start =
    minutesToFormTime(
      selectedStartTime
    );

  const end =
    minutesToFormTime(
      selectedEndTime
    );


  /*
    IMPORTANT:

    Google Forms date prefill uses
    YYYY-MM-DD.

    selectedDate is already in
    YYYY-MM-DD format.
  */

  const formDate =
    selectedDate;


  const params =
    new URLSearchParams();


  params.append(
    "usp",
    "pp_url"
  );


  params.append(
    FORM_FIELDS.facility,
    selectedFacility.facility
  );


  params.append(
    FORM_FIELDS.date,
    formDate
  );


  params.append(
    FORM_FIELDS.start,
    start
  );


  params.append(
    FORM_FIELDS.end,
    end
  );


  const url =
    GOOGLE_FORM_URL +
    "?" +
    params.toString();


  console.log(
    "Google Form prefill:",
    {

      facility:
        selectedFacility.facility,

      date:
        formDate,

      start:
        start,

      end:
        end,

      url:
        url

    }
  );


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   GOOGLE FORM TIME
========================================================= */

function minutesToFormTime(
  minutes
) {

  const hours =
    Math.floor(
      minutes / 60
    );

  const mins =
    minutes % 60;

  return (
    String(hours)
      .padStart(
        2,
        "0"
      ) +
    ":" +
    String(mins)
      .padStart(
        2,
        "0"
      )
  );

}


/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";

  }

  const text =
    String(value)
      .trim();


  /*
    Google Sheets Date():

    Date(1899,11,30,8,0,0)
  */

  const dateMatch =
    text.match(
      /Date\(\d+,\s*\d+,\s*\d+,\s*(\d+),\s*(\d+)(?:,\s*(\d+))?/
    );


  if (
    dateMatch
  ) {

    const hours =
      parseInt(
        dateMatch[1]
      );

    const minutes =
      parseInt(
        dateMatch[2]
      );

    return minutesToTime(
      hours * 60 +
      minutes
    );

  }


  /*
    24-hour:

    08:00
    08:00:00
  */

  let match =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if (
    match
  ) {

    const hours =
      parseInt(
        match[1]
      );

    const minutes =
      parseInt(
        match[2]
      );

    if (
      hours >= 0 &&
      hours <= 23 &&
      minutes >= 0 &&
      minutes <= 59
    ) {

      return minutesToTime(
        hours * 60 +
        minutes
      );

    }

  }


  /*
    12-hour:

    8:00 AM
    11:30 PM
  */

  match =
    text.match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
    );


  if (
    match
  ) {

    let hours =
      parseInt(
        match[1]
      );

    const minutes =
      parseInt(
        match[2]
      );

    const period =
      match[3].toUpperCase();


    if (
      hours >= 1 &&
      hours <= 12 &&
      minutes >= 0 &&
      minutes <= 59
    ) {

      if (
        period === "AM"
      ) {

        if (
          hours === 12
        ) {

          hours = 0;

        }

      }

      else {

        if (
          hours !== 12
        ) {

          hours += 12;

        }

      }


      return minutesToTime(
        hours * 60 +
        minutes
      );

    }

  }


  /*
    Google Sheets decimal time.
  */

  const numeric =
    Number(text);


  if (
    !isNaN(numeric) &&
    numeric >= 0 &&
    numeric < 1
  ) {

    const totalMinutes =
      Math.round(
        numeric *
        24 *
        60
      );

    return minutesToTime(
      totalMinutes
    );

  }


  console.warn(
    "Could not normalize time:",
    value
  );

  return "";

}


/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDate(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";

  }

  const text =
    String(value)
      .trim();


  /*
    Google Sheets:

    Date(2026,9,8)
  */

  const dateMatch =
    text.match(
      /Date\((\d+),\s*(\d+),\s*(\d+)/
    );


  if (
    dateMatch
  ) {

    const year =
      parseInt(
        dateMatch[1]
      );

    const month =
      parseInt(
        dateMatch[2]
      ) + 1;

    const day =
      parseInt(
        dateMatch[3]
      );

    return (
      year +
      "-" +
      String(month)
        .padStart(
          2,
          "0"
        ) +
      "-" +
      String(day)
        .padStart(
          2,
          "0"
        )
    );

  }


  /*
    Already YYYY-MM-DD
  */

  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ) {

    return text;

  }


  /*
    DD/MM/YYYY
  */

  let match =
    text.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


  if (
    match
  ) {

    const day =
      parseInt(
        match[1]
      );

    const month =
      parseInt(
        match[2]
      );

    const year =
      parseInt(
        match[3]
      );

    return (
      year +
      "-" +
      String(month)
        .padStart(
          2,
          "0"
        ) +
      "-" +
      String(day)
        .padStart(
          2,
          "0"
        )
    );

  }


  /*
    Final fallback.
  */

  const parsed =
    new Date(
      text
    );


  if (
    !isNaN(
      parsed.getTime()
    )
  ) {

    return formatDateForInput(
      parsed
    );

  }


  return "";

}


/* =========================================================
   TIME UTILITIES
========================================================= */

function timeToMinutes(
  time
) {

  if (
    !time
  ) {

    return NaN;

  }

  const parts =
    time.split(":");

  return (
    parseInt(
      parts[0]
    ) *
      60 +

    parseInt(
      parts[1]
    )
  );

}


function minutesToTime(
  minutes
) {

  const hours =
    Math.floor(
      minutes / 60
    );

  const mins =
    minutes % 60;

  return (
    String(hours)
      .padStart(
        2,
        "0"
      ) +
    ":" +
    String(mins)
      .padStart(
        2,
        "0"
      )
  );

}


function formatMinutes(
  minutes
) {

  let hours =
    Math.floor(
      minutes / 60
    );

  const mins =
    minutes % 60;

  const period =
    hours >= 12
      ? "PM"
      : "AM";


  if (
    hours === 0
  ) {

    hours = 12;

  }

  else if (
    hours > 12
  ) {

    hours -= 12;

  }


  return (
    hours +
    ":" +
    String(mins)
      .padStart(
        2,
        "0"
      ) +
    " " +
    period
  );

}


function formatTime(
  time
) {

  const minutes =
    timeToMinutes(
      time
    );

  if (
    isNaN(minutes)
  ) {

    return "Invalid time";

  }

  return formatMinutes(
    minutes
  );

}


function formatDuration(
  minutes
) {

  if (
    minutes < 60
  ) {

    return (
      minutes +
      " minutes"
    );

  }

  const hours =
    Math.floor(
      minutes / 60
    );

  const remainder =
    minutes % 60;


  if (
    remainder === 0
  ) {

    return (
      hours +
      (
        hours === 1
          ? " hour"
          : " hours"
      )
    );

  }


  return (
    hours +
    (
      hours === 1
        ? " hour "
        : " hours "
    ) +
    remainder +
    " minutes"
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
