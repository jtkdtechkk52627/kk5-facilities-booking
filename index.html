<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KK5 Facility Availability</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #666;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: #111;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    .availability-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .availability-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      background: #f0f0f0;
      margin-bottom: 15px;
      display: none;
    }

    .status.error {
      display: block;
      background: #ffe5e5;
      color: #a00000;
    }

    .status.loading {
      display: block;
      background: #eeeeee;
      color: #555;
    }

    .schedule {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slot {
      display: grid;
      grid-template-columns: 100px 1fr;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .slot-time {
      font-weight: bold;
      font-size: 14px;
    }

    .slot-status {
      font-size: 14px;
      font-weight: bold;
    }

    .available {
      background: #e9f7ed;
      border-color: #b8dfc2;
    }

    .available .slot-status {
      color: #187333;
    }

    .booked {
      background: #ffeaea;
      border-color: #edbaba;
    }

    .booked .slot-status {
      color: #b00000;
    }

    .pending {
      background: #fff7dc;
      border-color: #ead58a;
    }

    .pending .slot-status {
      color: #8a6800;
    }

    .booking-panel {
      display: none;
    }

    .booking-panel.show {
      display: block;
    }

    .selected-info {
      padding: 15px;
      background: #f3f3f3;
      border-radius: 8px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .message.error {
      display: block;
      background: #ffe5e5;
      color: #a00000;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
      font-size: 13px;
      color: #555;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.green {
      background: #2e9b4b;
    }

    .dot.red {
      background: #c62828;
    }

    .dot.yellow {
      background: #d6ad00;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #666;
      background: #f5f5f5;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 12px 40px;
      }

      h1 {
        font-size: 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .slot {
        grid-template-columns: 80px 1fr;
      }

      .availability-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>KK5 Facility Availability</h1>
  <p class="subtitle">
    Check facility availability and make a booking request.
  </p>

  <!-- SEARCH -->
  <div class="card">

    <div class="form-row">

      <div class="field">
        <label for="facility">
          Facility
        </label>

        <select id="facility">
          <option value="">
            Loading facilities...
          </option>
        </select>
      </div>

      <div class="field">
        <label for="date">
          Date
        </label>

        <input
          type="date"
          id="date"
        >
      </div>

    </div>

    <button
      id="checkButton"
      onclick="loadAvailability()"
    >
      Check Availability
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- AVAILABILITY -->
  <div
    class="card"
    id="availabilityCard"
    style="display:none;"
  >

    <div class="availability-header">

      <h2>
        Availability
      </h2>

      <div id="selectedDateText"></div>

    </div>

    <div
      id="schedule"
      class="schedule"
    ></div>

    <div class="legend">

      <span>
        <span class="dot green"></span>
        Available
      </span>

      <span>
        <span class="dot red"></span>
        Booked
      </span>

      <span>
        <span class="dot yellow"></span>
        Pending
      </span>

    </div>

  </div>


  <!-- BOOKING -->
  <div
    class="card booking-panel"
    id="bookingPanel"
  >

    <h2>
      Book a Slot
    </h2>

    <div
      class="selected-info"
      id="selectedInfo"
    ></div>

    <div class="form-row">

      <div class="field">

        <label for="startTime">
          Start Time
        </label>

        <select
          id="startTime"
          onchange="updateBooking()"
        >
          <option value="">
            Select start time
          </option>
        </select>

      </div>

      <div class="field">

        <label for="duration">
          Duration
        </label>

        <select
          id="duration"
          onchange="updateBooking()"
        >

          <option value="30">
            30 minutes
          </option>

          <option value="60">
            1 hour
          </option>

          <option value="90">
            1 hour 30 minutes
          </option>

          <option value="120">
            2 hours
          </option>

          <option value="150">
            2 hours 30 minutes
          </option>

          <option value="180">
            3 hours
          </option>

          <option value="210">
            3 hours 30 minutes
          </option>

          <option value="240">
            4 hours
          </option>

        </select>

      </div>

    </div>

    <div
      id="bookingMessage"
      class="message"
    ></div>

    <button
      id="bookButton"
      onclick="bookSelectedSlot()"
      disabled
    >
      Continue to Booking Form
    </button>

  </div>

</div>


<script>

/* ==================================================
   CONFIGURATION
   ================================================== */

/*
  IMPORTANT:
  Replace this with the ID of your EXISTING
  public Google Sheet.
*/

const PUBLIC_SHEET_ID =
  "1PGb7g244LFMQlqJdJWDGaeGsZzJsel9WTUakDcNatiQ";


const FACILITIES_URL =
  `https://docs.google.com/spreadsheets/d/${PUBLIC_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Facilities`;


const BOOKINGS_URL =
  `https://docs.google.com/spreadsheets/d/${PUBLIC_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Bookings`;


/*
  Google Form
*/

const FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSdja_U2aFCea0GAL6qZdaUxG5viyi4AlC-zROude_yzXAFIWg/viewform";


/*
  Google Form prefill IDs
*/

const FORM_FIELDS = {

  facility:
    "entry.1139525746",

  date:
    "entry.482205338",

  start:
    "entry.1117912077",

  end:
    "entry.866972168"

};


/* ==================================================
   GLOBAL VARIABLES
   ================================================== */

let facilities = [];

let bookings = [];

let availabilityData = null;


/* ==================================================
   INITIALISE
   ================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    setDefaultDate();

    loadFacilities();

  }
);


/* ==================================================
   DEFAULT DATE
   ================================================== */

function setDefaultDate() {

  const input =
    document.getElementById("date");

  const today =
    new Date();

  const year =
    today.getFullYear();

  const month =
    String(
      today.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      today.getDate()
    ).padStart(2, "0");

  input.value =
    `${year}-${month}-${day}`;

}


/* ==================================================
   GOOGLE GVIZ FETCH
   ================================================== */

async function fetchGviz(url) {

  const response =
    await fetch(url);

  if (!response.ok) {

    throw new Error(
      "Unable to access the public availability data."
    );

  }

  const text =
    await response.text();


  /*
    Google returns:

    google.visualization.Query.setResponse({...});
  */

  const match =
    text.match(
      /google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/
    );


  if (!match) {

    throw new Error(
      "Invalid Google Sheets response."
    );

  }


  return JSON.parse(
    match[1]
  );

}


/* ==================================================
   GVIZ ROW CONVERSION
   ================================================== */

function gvizRows(data) {

  if (
    !data ||
    !data.table ||
    !data.table.rows
  ) {

    return [];

  }


  return data.table.rows.map(
    row => {

      return row.c.map(
        cell => {

          if (!cell) {
            return "";
          }

          /*
            Prefer formatted value.
            This prevents Google date objects
            from causing problems.
          */

          return (
            cell.f !== undefined
              ? cell.f
              : cell.v
          );

        }
      );

    }
  );

}


/* ==================================================
   LOAD FACILITIES
   ================================================== */

async function loadFacilities() {

  const select =
    document.getElementById(
      "facility"
    );

  select.innerHTML =
    `<option value="">
      Loading facilities...
    </option>`;


  try {

    const data =
      await fetchGviz(
        FACILITIES_URL
      );


    const rows =
      gvizRows(data);


    facilities =
      rows.map(
        row => {

          return {

            name:
              String(
                row[0] || ""
              ).trim(),

            openingTime:
              String(
                row[1] || ""
              ).trim(),

            closingTime:
              String(
                row[2] || ""
              ).trim()

          };

        }
      )
      .filter(
        facility =>
          facility.name
      );


    select.innerHTML =
      `<option value="">
        Select a facility
      </option>`;


    facilities.forEach(
      facility => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          facility.name;

        option.textContent =
          facility.name;

        select.appendChild(
          option
        );

      }
    );


  } catch (error) {

    console.error(error);

    select.innerHTML =
      `<option value="">
        Failed to load facilities
      </option>`;

    showStatus(
      "Failed to load facilities. Please try again later.",
      "error"
    );

  }

}


/* ==================================================
   LOAD AVAILABILITY
   ================================================== */

async function loadAvailability() {

  const facility =
    document.getElementById(
      "facility"
    ).value;


  const date =
    document.getElementById(
      "date"
    ).value;


  if (!facility) {

    showStatus(
      "Please select a facility.",
      "error"
    );

    return;

  }


  if (!date) {

    showStatus(
      "Please select a date.",
      "error"
    );

    return;

  }


  showStatus(
    "Loading availability...",
    "loading"
  );


  document.getElementById(
    "availabilityCard"
  ).style.display =
    "none";


  document.getElementById(
    "bookingPanel"
  ).classList.remove(
    "show"
  );


  try {

    const url =
      BOOKINGS_URL +
      `&tqx=reqId:${Date.now()}`;


    const data =
      await fetchGviz(
        url
      );


    const rows =
      gvizRows(data);


    bookings =
      rows
        .map(
          row => {

            return {

              facility:
                String(
                  row[0] || ""
                ).trim(),

              date:
                normalizeDate(
                  row[1]
                ),

              start:
                normalizeTime(
                  row[2]
                ),

              end:
                normalizeTime(
                  row[3]
                ),

              status:
                String(
                  row[4] || ""
                )
                .trim()
                .toUpperCase()

            };

          }
        )
        .filter(
          booking =>
            booking.facility === facility &&
            booking.date === date &&
            (
              booking.status === "APPROVED" ||
              booking.status === "PENDING"
            )
        );


    const facilityInfo =
      facilities.find(
        item =>
          item.name === facility
      );


    if (!facilityInfo) {

      throw new Error(
        "Facility information could not be found."
      );

    }


    availabilityData = {

      facility:
        facility,

      date:
        date,

      openingTime:
        normalizeTime(
          facilityInfo.openingTime
        ),

      closingTime:
        normalizeTime(
          facilityInfo.closingTime
        ),

      bookings:
        bookings

    };


    renderAvailability(
      availabilityData
    );


    hideStatus();


  } catch (error) {

    console.error(error);

    showStatus(
      "Failed to load availability. Please try again.",
      "error"
    );

  }

}


/* ==================================================
   NORMALISE DATE
   ================================================== */

function normalizeDate(value) {

  if (!value) {
    return "";
  }


  const string =
    String(value).trim();


  /*
    Already yyyy-MM-dd
  */

  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      string
    )
  ) {

    return string;

  }


  /*
    Handle dd/MM/yyyy
  */

  const slash =
    string.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


  if (slash) {

    return (
      slash[3] +
      "-" +
      String(
        slash[2]
      ).padStart(2, "0") +
      "-" +
      String(
        slash[1]
      ).padStart(2, "0")
    );

  }


  return string;

}


/* ==================================================
   NORMALISE TIME
   ================================================== */

function normalizeTime(value) {

  if (!value) {
    return "";
  }


  let string =
    String(value)
      .trim();


  /*
    Handle HH:mm:ss
  */

  if (
    /^\d{1,2}:\d{2}:\d{2}$/.test(
      string
    )
  ) {

    string =
      string.substring(
        0,
        5
      );

  }


  /*
    Handle HH:mm
  */

  if (
    /^\d{1,2}:\d{2}$/.test(
      string
    )
  ) {

    const parts =
      string.split(":");

    return (
      String(
        parts[0]
      ).padStart(2, "0") +
      ":" +
      parts[1]
    );

  }


  /*
    Handle 12-hour time
  */

  const match =
    string.match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
    );


  if (match) {

    let hour =
      parseInt(
        match[1],
        10
      );

    const minute =
      match[2];

    const period =
      match[3].toUpperCase();


    if (
      period === "PM" &&
      hour !== 12
    ) {

      hour += 12;

    }


    if (
      period === "AM" &&
      hour === 12
    ) {

      hour = 0;

    }


    return (
      String(hour).padStart(
        2,
        "0"
      ) +
      ":" +
      minute
    );

  }


  return string;

}


/* ==================================================
   RENDER AVAILABILITY
   ================================================== */

function renderAvailability(data) {

  const card =
    document.getElementById(
      "availabilityCard"
    );


  const schedule =
    document.getElementById(
      "schedule"
    );


  const dateText =
    document.getElementById(
      "selectedDateText"
    );


  schedule.innerHTML =
    "";


  dateText.textContent =
    formatDisplayDate(
      data.date
    );


  const opening =
    timeToMinutes(
      data.openingTime
    );


  const closing =
    timeToMinutes(
      data.closingTime
    );


  if (
    opening === null ||
    closing === null ||
    closing <= opening
  ) {

    schedule.innerHTML =
      `<div class="empty">
        Invalid facility operating hours.
      </div>`;

    card.style.display =
      "block";

    return;

  }


  let current =
    opening;


  while (
    current < closing
  ) {

    const end =
      current + 30;


    if (
      end > closing
    ) {

      break;

    }


    const startTime =
      minutesToTime(
        current
      );

    const endTime =
      minutesToTime(
        end
      );


    const booking =
      findBookingForSlot(
        startTime,
        endTime
      );


    const slot =
      document.createElement(
        "div"
      );


    slot.className =
      "slot";


    if (!booking) {

      slot.classList.add(
        "available"
      );

      slot.innerHTML = `
        <div class="slot-time">
          ${startTime} – ${endTime}
        </div>

        <div class="slot-status">
          🟢 AVAILABLE
        </div>
      `;

    } else if (
      booking.status === "PENDING"
    ) {

      slot.classList.add(
        "pending"
      );

      slot.innerHTML = `
        <div class="slot-time">
          ${startTime} – ${endTime}
        </div>

        <div class="slot-status">
          🟡 PENDING
        </div>
      `;

    } else {

      slot.classList.add(
        "booked"
      );

      slot.innerHTML = `
        <div class="slot-time">
          ${startTime} – ${endTime}
        </div>

        <div class="slot-status">
          🔴 BOOKED
        </div>
      `;

    }


    schedule.appendChild(
      slot
    );


    current += 30;

  }


  card.style.display =
    "block";


  populateStartTimes();

}


/* ==================================================
   FIND BOOKING
   ================================================== */

function findBookingForSlot(
  start,
  end
) {

  const startMinutes =
    timeToMinutes(
      start
    );

  const endMinutes =
    timeToMinutes(
      end
    );


  return bookings.find(
    booking => {

      const bookingStart =
        timeToMinutes(
          booking.start
        );

      const bookingEnd =
        timeToMinutes(
          booking.end
        );


      return (
        startMinutes <
          bookingEnd &&
        endMinutes >
          bookingStart
      );

    }
  );

}


/* ==================================================
   POPULATE START TIMES
   ================================================== */

function populateStartTimes() {

  const select =
    document.getElementById(
      "startTime"
    );


  select.innerHTML =
    `<option value="">
      Select start time
    </option>`;


  if (!availabilityData) {
    return;
  }


  const opening =
    timeToMinutes(
      availabilityData.openingTime
    );

  const closing =
    timeToMinutes(
      availabilityData.closingTime
    );


  for (
    let time = opening;
    time < closing;
    time += 30
  ) {

    const value =
      minutesToTime(
        time
      );


    const option =
      document.createElement(
        "option"
      );


    option.value =
      value;

    option.textContent =
      value;


    /*
      Don't allow starting a booking
      in an already occupied slot.
    */

    if (
      findBookingForSlot(
        value,
        minutesToTime(
          time + 30
        )
      )
    ) {

      option.disabled =
        true;

      option.textContent =
        `${value} — unavailable`;

    }


    select.appendChild(
      option
    );

  }


  resetBookingControls();

}


/* ==================================================
   UPDATE BOOKING
   ================================================== */

function updateBooking() {

  const start =
    document.getElementById(
      "startTime"
    ).value;


  const duration =
    parseInt(
      document.getElementById(
        "duration"
      ).value,
      10
    );


  const message =
    document.getElementById(
      "bookingMessage"
    );


  const button =
    document.getElementById(
      "bookButton"
    );


  message.className =
    "message";

  message.textContent =
    "";


  button.disabled =
    true;


  if (!start) {

    return;

  }


  const startMinutes =
    timeToMinutes(
      start
    );


  const endMinutes =
    startMinutes +
    duration;


  const end =
    minutesToTime(
      endMinutes
    );


  const closing =
    timeToMinutes(
      availabilityData.closingTime
    );


  if (
    endMinutes >
    closing
  ) {

    showBookingError(
      "The selected duration exceeds the facility's closing time."
    );

    return;

  }


  if (
    checkBookingConflict(
      start,
      end
    )
  ) {

    showBookingError(
      "This time overlaps with an existing booking. Please choose another time."
    );

    return;

  }


  document.getElementById(
    "selectedInfo"
  ).innerHTML = `

    <strong>Facility:</strong>
    ${escapeHtml(
      availabilityData.facility
    )}

    <br>

    <strong>Date:</strong>
    ${formatDisplayDate(
      availabilityData.date
    )}

    <br>

    <strong>Time:</strong>
    ${start} – ${end}

    <br>

    <strong>Duration:</strong>
    ${duration} minutes

  `;


  document.getElementById(
    "bookingPanel"
  ).classList.add(
    "show"
  );


  button.disabled =
    false;

}


/* ==================================================
   CHECK CONFLICT
   ================================================== */

function checkBookingConflict(
  start,
  end
) {

  const startMinutes =
    timeToMinutes(
      start
    );

  const endMinutes =
    timeToMinutes(
      end
    );


  return bookings.some(
    booking => {

      const bookingStart =
        timeToMinutes(
          booking.start
        );

      const bookingEnd =
        timeToMinutes(
          booking.end
        );


      return (
        startMinutes <
          bookingEnd &&
        endMinutes >
          bookingStart
      );

    }
  );

}


/* ==================================================
   BOOK SELECTED SLOT
   ================================================== */

function bookSelectedSlot() {

  if (!availabilityData) {
    return;
  }


  const start =
    document.getElementById(
      "startTime"
    ).value;


  const duration =
    parseInt(
      document.getElementById(
        "duration"
      ).value,
      10
    );


  if (!start) {

    showBookingError(
      "Please select a start time."
    );

    return;

  }


  const startMinutes =
    timeToMinutes(
      start
    );


  const endMinutes =
    startMinutes +
    duration;


  const end =
    minutesToTime(
      endMinutes
    );


  if (
    checkBookingConflict(
      start,
      end
    )
  ) {

    showBookingError(
      "This time is no longer available."
    );

    return;

  }


  const url =
    FORM_URL +
    "?usp=pp_url" +

    "&" +
    FORM_FIELDS.facility +
    "=" +
    encodeURIComponent(
      availabilityData.facility
    ) +

    "&" +
    FORM_FIELDS.date +
    "=" +
    encodeURIComponent(
      availabilityData.date
    ) +

    "&" +
    FORM_FIELDS.start +
    "=" +
    encodeURIComponent(
      start
    ) +

    "&" +
    FORM_FIELDS.end +
    "=" +
    encodeURIComponent(
      end
    );


  window.open(
    url,
    "_blank"
  );

}


/* ==================================================
   RESET BOOKING
   ================================================== */

function resetBookingControls() {

  document.getElementById(
    "startTime"
  ).value = "";


  document.getElementById(
    "duration"
  ).value = "30";


  document.getElementById(
    "bookingPanel"
  ).classList.remove(
    "show"
  );


  document.getElementById(
    "bookButton"
  ).disabled =
    true;

}


/* ==================================================
   TIME FUNCTIONS
   ================================================== */

function timeToMinutes(
  time
) {

  if (!time) {
    return null;
  }


  const parts =
    String(time).split(":");


  if (
    parts.length < 2
  ) {

    return null;

  }


  const hours =
    parseInt(
      parts[0],
      10
    );


  const minutes =
    parseInt(
      parts[1],
      10
    );


  if (
    Number.isNaN(hours) ||
    Number.isNaN(minutes)
  ) {

    return null;

  }


  return (
    hours * 60 +
    minutes
  );

}


function minutesToTime(
  minutes
) {

  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    minutes % 60;


  return (
    String(hours).padStart(
      2,
      "0"
    ) +
    ":" +
    String(mins).padStart(
      2,
      "0"
    )
  );

}


/* ==================================================
   DISPLAY DATE
   ================================================== */

function formatDisplayDate(
  date
) {

  if (!date) {
    return "";
  }


  const parts =
    date.split("-");


  if (
    parts.length !== 3
  ) {

    return date;

  }


  const year =
    parseInt(
      parts[0],
      10
    );

  const month =
    parseInt(
      parts[1],
      10
    ) - 1;

  const day =
    parseInt(
      parts[2],
      10
    );


  const dateObject =
    new Date(
      year,
      month,
      day
    );


  return dateObject.toLocaleDateString(
    "en-MY",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


/* ==================================================
   STATUS MESSAGE
   ================================================== */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status " +
    type;

}


function hideStatus() {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "";

  status.className =
    "status";

}


/* ==================================================
   BOOKING ERROR
   ================================================== */

function showBookingError(
  message
) {

  const element =
    document.getElementById(
      "bookingMessage"
    );


  element.textContent =
    message;


  element.className =
    "message error";

}


/* ==================================================
   HTML ESCAPE
   ================================================== */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
