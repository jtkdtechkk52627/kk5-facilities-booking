<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KK5 Facility Booking</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        #f5f7fa;

      color:
        #1f2937;

    }


    .container {

      width: 100%;

      max-width: 1000px;

      margin: 0 auto;

      padding:
        32px 20px 60px;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      margin-bottom: 30px;

    }


    .header h1 {

      margin: 0 0 8px;

      font-size: 32px;

      font-weight: 700;

      color:
        #111827;

    }


    .header p {

      margin: 0;

      color:
        #6b7280;

      font-size: 15px;

    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {

      display: none;

    }


    .page.active {

      display: block;

    }


    /* =====================================================
       FACILITY GRID
       ===================================================== */

    .facility-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(240px, 1fr)
        );

      gap: 18px;

    }


    .facility-card {

      background:
        white;

      border:
        1px solid #e5e7eb;

      border-radius:
        14px;

      padding:
        22px;

      min-height:
        150px;

      cursor:
        pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        space-between;

    }


    .facility-card:hover {

      transform:
        translateY(-2px);

      border-color:
        #cbd5e1;

      box-shadow:
        0 8px 24px rgba(
          0,
          0,
          0,
          0.07
        );

    }


    .facility-card.inactive {

      cursor:
        not-allowed;

      background:
        #f8fafc;

      border-color:
        #e5e7eb;

      opacity:
        0.78;

    }


    .facility-card.inactive:hover {

      transform:
        none;

      box-shadow:
        none;

      border-color:
        #e5e7eb;

    }


    .facility-name {

      font-size:
        18px;

      font-weight:
        650;

      color:
        #111827;

      line-height:
        1.35;

    }


    .facility-hours {

      margin-top:
        12px;

      font-size:
        14px;

      color:
        #6b7280;

    }


    .facility-status {

      margin-top:
        16px;

      font-size:
        12px;

      font-weight:
        700;

      letter-spacing:
        0.04em;

    }


    .facility-status.available {

      color:
        #15803d;

    }


    .facility-status.unavailable {

      color:
        #b91c1c;

    }


    /* =====================================================
       BACK BUTTON
       ===================================================== */

    .back-button {

      border:
        none;

      background:
        transparent;

      padding:
        0;

      margin-bottom:
        20px;

      color:
        #2563eb;

      font-size:
        14px;

      font-weight:
        600;

      cursor:
        pointer;

    }


    .back-button:hover {

      text-decoration:
        underline;

    }


    /* =====================================================
       FACILITY TITLE
       ===================================================== */

    .facility-header {

      background:
        white;

      border:
        1px solid #e5e7eb;

      border-radius:
        14px;

      padding:
        24px;

      margin-bottom:
        18px;

    }


    .facility-header h2 {

      margin:
        0 0 8px;

      font-size:
        26px;

      color:
        #111827;

    }


    .facility-header p {

      margin:
        0;

      color:
        #6b7280;

      font-size:
        14px;

    }


    /* =====================================================
       BOOKING PANEL
       ===================================================== */

    .booking-panel {

      background:
        white;

      border:
        1px solid #e5e7eb;

      border-radius:
        14px;

      padding:
        24px;

    }


    .form-group {

      margin-bottom:
        20px;

    }


    .form-group label {

      display:
        block;

      margin-bottom:
        8px;

      font-size:
        14px;

      font-weight:
        600;

      color:
        #374151;

    }


    input,
    select {

      width:
        100%;

      height:
        46px;

      border:
        1px solid #d1d5db;

      border-radius:
        9px;

      padding:
        0 12px;

      background:
        white;

      color:
        #111827;

      font-size:
        15px;

      outline:
        none;

    }


    input:focus,
    select:focus {

      border-color:
        #2563eb;

      box-shadow:
        0 0 0 3px rgba(
          37,
          99,
          235,
          0.1
        );

    }


    input[readonly] {

      background:
        #f9fafb;

      color:
        #4b5563;

    }


    .time-row {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        14px;

    }


    /* =====================================================
       AVAILABILITY
       ===================================================== */

    .availability-section {

      margin-top:
        26px;

    }


    .availability-title {

      margin:
        0 0 12px;

      font-size:
        16px;

      font-weight:
        650;

      color:
        #111827;

    }


    .availability-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(100px, 1fr)
        );

      gap:
        8px;

    }


    .slot {

      border:
        1px solid #d1d5db;

      background:
        white;

      border-radius:
        8px;

      padding:
        10px 6px;

      text-align:
        center;

      font-size:
        13px;

      cursor:
        pointer;

      transition:
        all 0.12s ease;

    }


    .slot:hover {

      border-color:
        #2563eb;

      background:
        #eff6ff;

    }


    .slot.selected {

      border-color:
        #2563eb;

      background:
        #2563eb;

      color:
        white;

      font-weight:
        600;

    }


    .slot.booked {

      cursor:
        not-allowed;

      background:
        #f3f4f6;

      border-color:
        #e5e7eb;

      color:
        #9ca3af;

    }


    .slot.pending {

      cursor:
        not-allowed;

      background:
        #fff7ed;

      border-color:
        #fed7aa;

      color:
        #c2410c;

    }


    .availability-message {

      padding:
        18px;

      background:
        #f9fafb;

      border:
        1px solid #e5e7eb;

      border-radius:
        10px;

      color:
        #6b7280;

      font-size:
        14px;

    }


    /* =====================================================
       CONTINUE BUTTON
       ===================================================== */

    .continue-button {

      width:
        100%;

      height:
        48px;

      margin-top:
        10px;

      border:
        none;

      border-radius:
        9px;

      background:
        #111827;

      color:
        white;

      font-size:
        15px;

      font-weight:
        600;

      cursor:
        pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;

    }


    .continue-button:hover {

      background:
        #1f2937;

    }


    .continue-button:active {

      transform:
        scale(0.99);

    }


    .continue-button:disabled {

      background:
        #d1d5db;

      cursor:
        not-allowed;

      transform:
        none;

    }


    /* =====================================================
       LOADING / ERROR
       ===================================================== */

    .message {

      padding:
        18px;

      border-radius:
        10px;

      font-size:
        14px;

      margin-bottom:
        18px;

    }


    .message.error {

      background:
        #fef2f2;

      border:
        1px solid #fecaca;

      color:
        #b91c1c;

    }


    .message.loading {

      background:
        #eff6ff;

      border:
        1px solid #bfdbfe;

      color:
        #1d4ed8;

    }


    .hidden {

      display:
        none !important;

    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (
      max-width: 600px
    ) {

      .container {

        padding:
          24px 14px 40px;

      }


      .header h1 {

        font-size:
          27px;

      }


      .facility-grid {

        grid-template-columns:
          1fr;

      }


      .time-row {

        grid-template-columns:
          1fr;

      }


      .availability-grid {

        grid-template-columns:
          repeat(
            3,
            1fr
          );

      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- ===================================================
         HEADER
         =================================================== -->

    <div class="header">

      <h1>
        KK5 Facility Booking
      </h1>

      <p>
        Select a facility to view its availability and make a booking.
      </p>

    </div>


    <!-- ===================================================
         ERROR MESSAGE
         =================================================== -->

    <div
      id="errorMessage"
      class="message error hidden"
    ></div>


    <!-- ===================================================
         FACILITY PAGE
         =================================================== -->

    <section
      id="facilityPage"
      class="page active"
    >

      <div
        id="facilityLoading"
        class="message loading"
      >
        Loading facilities...
      </div>


      <div
        id="facilityGrid"
        class="facility-grid"
      ></div>

    </section>


    <!-- ===================================================
         BOOKING PAGE
         =================================================== -->

    <section
      id="bookingPage"
      class="page"
    >

      <button
        type="button"
        class="back-button"
        onclick="goBackToFacilities()"
      >
        ← Back to facilities
      </button>


      <div class="facility-header">

        <h2
          id="selectedFacilityName"
        >
          Facility
        </h2>

        <p
          id="selectedFacilityHours"
        >
          Operating hours
        </p>

      </div>


      <div class="booking-panel">


        <!-- DATE -->

        <div class="form-group">

          <label for="bookingDate">
            Date
          </label>

          <input
            type="date"
            id="bookingDate"
          >

        </div>


        <!-- START + DURATION -->

        <div class="time-row">


          <div class="form-group">

            <label for="startTime">
              Start time
            </label>

            <select
              id="startTime"
              onchange="handleStartTimeChange()"
            >

              <option value="">
                Select start time
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="duration">
              Duration
            </label>

            <select
              id="duration"
              onchange="updateEndTime()"
              disabled
            >

              <option value="">
                Select duration
              </option>

            </select>

          </div>

        </div>


        <!-- END -->

        <div class="form-group">

          <label for="endTime">
            End time
          </label>

          <input
            type="text"
            id="endTime"
            readonly
            placeholder="Automatically calculated"
          >

        </div>


        <!-- AVAILABILITY -->

        <div class="availability-section">

          <h3 class="availability-title">
            Availability
          </h3>


          <div
            id="availabilityMessage"
            class="availability-message"
          >
            Select a date to view availability.
          </div>


          <div
            id="availabilityGrid"
            class="availability-grid"
          ></div>

        </div>


        <!-- CONTINUE -->

        <button
          type="button"
          id="continueButton"
          class="continue-button"
          onclick="continueToForm()"
          disabled
        >
          Continue to booking form
        </button>

      </div>

    </section>


  </div>


  <script>

    /* =====================================================
       CONFIGURATION
       ===================================================== */

    const PUBLIC_SHEET_ID =
      "1PGb7g244LFMQlqJdJWDGaeGsZzJsel9WTUakDcNatiQ";


    const GOOGLE_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSdja_U2aFCea0GAL6qZdaUxG5viyi4AlC-zROude_yzXAFIWg/viewform";


    const FORM_FIELDS = {

      facility:
        "entry.1139525746",

      date:
        "entry.482205338",

      start:
        "entry.1117912077",

      end:
        "entry.866972168"

    };


    const MIN_DURATION =
      30;


    const MAX_DURATION =
      240;


    const SLOT_INTERVAL =
      30;


    /* =====================================================
       STATE
       ===================================================== */

    let facilities = [];

    let selectedFacility = null;

    let selectedDate = "";

    let selectedStartTime = null;

    let selectedEndTime = null;

    let currentBookings = [];


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const facilityPage =
      document.getElementById(
        "facilityPage"
      );


    const bookingPage =
      document.getElementById(
        "bookingPage"
      );


    const facilityGrid =
      document.getElementById(
        "facilityGrid"
      );


    const facilityLoading =
      document.getElementById(
        "facilityLoading"
      );


    const selectedFacilityName =
      document.getElementById(
        "selectedFacilityName"
      );


    const selectedFacilityHours =
      document.getElementById(
        "selectedFacilityHours"
      );


    const bookingDate =
      document.getElementById(
        "bookingDate"
      );


    const startTime =
      document.getElementById(
        "startTime"
      );


    const duration =
      document.getElementById(
        "duration"
      );


    const endTime =
      document.getElementById(
        "endTime"
      );


    const availabilityGrid =
      document.getElementById(
        "availabilityGrid"
      );


    const availabilityMessage =
      document.getElementById(
        "availabilityMessage"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadFacilities();

      }
    );


    /* =====================================================
       GVIZ FETCH
       ===================================================== */

    async function fetchGviz(
      sheetName
    ) {

      const url =
        "https://docs.google.com/spreadsheets/d/" +
        PUBLIC_SHEET_ID +
        "/gviz/tq" +
        "?sheet=" +
        encodeURIComponent(
          sheetName
        ) +
        "&tqx=out:json";


      try {

        const response =
          await fetch(
            url,
            {
              method:
                "GET",

              redirect:
                "follow",

              cache:
                "no-store"
            }
          );


        const text =
          await response.text();


        console.log(
          "GViz response:",
          response.status,
          text.substring(
            0,
            300
          )
        );


        if (
          !response.ok
        ) {

          throw new Error(
            "Google Sheet returned HTTP " +
            response.status
          );

        }


        const start =
          text.indexOf("(");


        const end =
          text.lastIndexOf(")");


        if (
          start === -1 ||
          end === -1
        ) {

          throw new Error(
            "Google Sheet returned an invalid Gviz response."
          );

        }


        return JSON.parse(
          text.substring(
            start + 1,
            end
          )
        );

      } catch (error) {

        console.error(
          "GViz fetch failed:",
          error
        );

        throw error;

      }

    }


    /* =====================================================
       LOAD FACILITIES
       ===================================================== */

    async function loadFacilities() {

      hideError();


      facilityLoading.classList.remove(
        "hidden"
      );


      facilityGrid.innerHTML = "";


      try {

        const data =
          await fetchGviz(
            "Facilities"
          );


        facilities =
          parseFacilities(
            data
          );


        if (
          facilities.length === 0
        ) {

          throw new Error(
            "No facilities were found in the public sheet."
          );

        }


        renderFacilities();


      } catch (error) {

        showError(
          "Failed to load facilities. " +
          error.message
        );

      } finally {

        facilityLoading.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================================
       PARSE FACILITIES
       ===================================================== */

    function parseFacilities(
      data
    ) {

      if (
        !data ||
        !data.table ||
        !data.table.rows
      ) {

        return [];

      }


      return data.table.rows
        .map(
          function(row) {

            const cells =
              row.c || [];


            const facility =
              String(
                getCellValue(
                  cells[0]
                )
              ).trim();


            const openingTime =
              String(
                getCellValue(
                  cells[1]
                )
              ).trim();


            const closingTime =
              String(
                getCellValue(
                  cells[2]
                )
              ).trim();


            /*
               NEW:

               Column D = Status

               If the status is missing,
               default to ACTIVE for backwards
               compatibility.
            */

            const status =
              String(
                getCellValue(
                  cells[3]
                ) ||
                "ACTIVE"
              )
                .trim()
                .toUpperCase();


            if (
              !facility ||
              facility.toLowerCase() ===
              "facility"
            ) {

              return null;

            }


            return {

              facility:
                facility,

              openingTime:
                openingTime,

              closingTime:
                closingTime,

              status:
                status === "ACTIVE"
                  ? "ACTIVE"
                  : "INACTIVE"

            };

          }
        )
        .filter(
          Boolean
        );

    }


    /* =====================================================
       GET GVIZ CELL VALUE
       ===================================================== */

    function getCellValue(
      cell
    ) {

      if (!cell) {

        return "";

      }


      if (
        cell.f !== undefined &&
        cell.f !== null
      ) {

        return cell.f;

      }


      if (
        cell.v !== undefined &&
        cell.v !== null
      ) {

        return cell.v;

      }


      return "";

    }


    /* =====================================================
       RENDER FACILITIES
       ===================================================== */

    function renderFacilities() {

      facilityGrid.innerHTML = "";


      facilities.forEach(
        function(facility) {

          const card =
            document.createElement(
              "div"
            );


          const inactive =
            facility.status !==
            "ACTIVE";


          card.className =
            "facility-card" +
            (
              inactive
                ? " inactive"
                : ""
            );


          if (!inactive) {

            card.addEventListener(
              "click",
              function() {

                openFacility(
                  facility
                );

              }
            );

          }


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "facility-name";


          name.textContent =
            facility.facility;


          const hours =
            document.createElement(
              "div"
            );


          hours.className =
            "facility-hours";


          if (
            facility.openingTime &&
            facility.closingTime
          ) {

            hours.textContent =
              "Open " +
              formatDisplayTime(
                facility.openingTime
              ) +
              " – " +
              formatDisplayTime(
                facility.closingTime
              );

          } else {

            hours.textContent =
              "Operating hours unavailable";

          }


          const status =
            document.createElement(
              "div"
            );


          status.className =
            "facility-status " +
            (
              inactive
                ? "unavailable"
                : "available"
            );


          status.textContent =
            inactive
              ? "UNAVAILABLE FOR BOOKING"
              : "AVAILABLE FOR BOOKING";


          card.appendChild(
            name
          );

          card.appendChild(
            hours
          );

          card.appendChild(
            status
          );


          facilityGrid.appendChild(
            card
          );

        }
      );

    }


    /* =====================================================
       OPEN FACILITY
       ===================================================== */

    function openFacility(
      facility
    ) {

      /*
         Extra safety check.

         Even if an inactive facility somehow
         receives a click, it cannot proceed.
      */

      if (
        !facility ||
        facility.status !==
        "ACTIVE"
      ) {

        return;

      }


      selectedFacility =
        facility;


      selectedFacilityName.textContent =
        facility.facility;


      selectedFacilityHours.textContent =
        "Operating hours: " +
        formatDisplayTime(
          facility.openingTime
        ) +
        " – " +
        formatDisplayTime(
          facility.closingTime
        );


      resetBookingState();


      facilityPage.classList.remove(
        "active"
      );


      bookingPage.classList.add(
        "active"
      );

    }


    /* =====================================================
       BACK TO FACILITIES
       ===================================================== */

    function goBackToFacilities() {

      selectedFacility =
        null;


      resetBookingState();


      bookingPage.classList.remove(
        "active"
      );


      facilityPage.classList.add(
        "active"
      );


      hideError();

    }


    /* =====================================================
       RESET BOOKING STATE
       ===================================================== */

    function resetBookingState() {

      selectedDate =
        "";

      selectedStartTime =
        null;

      selectedEndTime =
        null;

      currentBookings =
        [];


      bookingDate.value =
        "";

      startTime.innerHTML =
        '<option value="">Select start time</option>';

      duration.innerHTML =
        '<option value="">Select duration</option>';

      duration.disabled =
        true;

      endTime.value =
        "";

      availabilityGrid.innerHTML =
        "";

      availabilityMessage.textContent =
        "Select a date to view availability.";


      continueButton.disabled =
        true;

    }


    /* =====================================================
       DATE CHANGE
       ===================================================== */

    bookingDate.addEventListener(
      "change",
      async function() {

        selectedDate =
          bookingDate.value;


        selectedStartTime =
          null;

        selectedEndTime =
          null;


        startTime.innerHTML =
          '<option value="">Select start time</option>';


        duration.innerHTML =
          '<option value="">Select duration</option>';


        duration.disabled =
          true;


        endTime.value =
          "";


        continueButton.disabled =
          true;


        if (
          !selectedDate
        ) {

          availabilityMessage.textContent =
            "Select a date to view availability.";

          availabilityGrid.innerHTML =
            "";

          return;

        }


        await loadAvailability();

      }
    );


    /* =====================================================
       LOAD AVAILABILITY
       ===================================================== */

    async function loadAvailability() {

      if (
        !selectedFacility ||
        !selectedDate
      ) {

        return;

      }


      availabilityGrid.innerHTML =
        "";


      availabilityMessage.className =
        "availability-message";


      availabilityMessage.textContent =
        "Loading availability...";


      try {

        const data =
          await fetchGviz(
            "Bookings"
          );


        currentBookings =
          parseBookings(
            data,
            selectedFacility.facility,
            selectedDate
          );


        renderAvailability();


        populateStartTimes();


        availabilityMessage.textContent =
          "Select an available start time.";

      } catch (error) {

        console.error(
          error
        );


        availabilityMessage.className =
          "availability-message";


        availabilityMessage.textContent =
          "Failed to load availability. " +
          error.message;


        availabilityGrid.innerHTML =
          "";

      }

    }


    /* =====================================================
       PARSE BOOKINGS
       ===================================================== */

    function parseBookings(
      data,
      facilityName,
      date
    ) {

      if (
        !data ||
        !data.table ||
        !data.table.rows
      ) {

        return [];

      }


      const targetFacility =
        String(
          facilityName
        )
          .trim()
          .toLowerCase();


      return data.table.rows
        .map(
          function(row) {

            const cells =
              row.c || [];


            const facility =
              String(
                getCellValue(
                  cells[0]
                )
              ).trim();


            const bookingDate =
              String(
                getCellValue(
                  cells[1]
                )
              ).trim();


            const start =
              normalizeTime(
                getCellValue(
                  cells[2]
                )
              );


            const end =
              normalizeTime(
                getCellValue(
                  cells[3]
                )
              );


            const status =
              String(
                getCellValue(
                  cells[4]
                )
              )
                .trim()
                .toUpperCase();


            if (
              !facility ||
              facility.toLowerCase() ===
              "facility"
            ) {

              return null;

            }


            if (
              facility
                .toLowerCase() !==
              targetFacility
            ) {

              return null;

            }


            if (
              normalizeDate(
                bookingDate
              ) !==
              date
            ) {

              return null;

            }


            if (
              status !== "PENDING" &&
              status !== "APPROVED"
            ) {

              return null;

            }


            if (
              !start ||
              !end
            ) {

              return null;

            }


            return {

              start:
                timeToMinutes(
                  start
                ),

              end:
                timeToMinutes(
                  end
                ),

              status:
                status

            };

          }
        )
        .filter(
          Boolean
        );

    }


    /* =====================================================
       RENDER AVAILABILITY
       ===================================================== */

    function renderAvailability() {

      availabilityGrid.innerHTML =
        "";


      if (
        !selectedFacility
      ) {

        return;

      }


      const opening =
        timeToMinutes(
          normalizeTime(
            selectedFacility.openingTime
          )
        );


      const closing =
        timeToMinutes(
          normalizeTime(
            selectedFacility.closingTime
          )
        );


      if (
        opening === null ||
        closing === null ||
        closing <= opening
      ) {

        availabilityMessage.textContent =
          "Operating hours are unavailable.";

        return;

      }


      for (
        let minutes = opening;
        minutes < closing;
        minutes += SLOT_INTERVAL
      ) {

        const slot =
          document.createElement(
            "div"
          );


        slot.className =
          "slot";


        slot.textContent =
          minutesToDisplayTime(
            minutes
          );


        const booking =
          findBookingAtTime(
            minutes
          );


        if (
          booking
        ) {

          if (
            booking.status ===
            "APPROVED"
          ) {

            slot.classList.add(
              "booked"
            );

            slot.textContent =
              minutesToDisplayTime(
                minutes
              ) +
              " • Booked";

          } else {

            slot.classList.add(
              "pending"
            );

            slot.textContent =
              minutesToDisplayTime(
                minutes
              ) +
              " • Pending";

          }

        } else {

          slot.addEventListener(
            "click",
            function() {

              selectStartTime(
                minutes
              );

            }
          );

        }


        availabilityGrid.appendChild(
          slot
        );

      }

    }


    /* =====================================================
       FIND BOOKING
       ===================================================== */

    function findBookingAtTime(
      minutes
    ) {

      return currentBookings.find(
        function(booking) {

          return (
            minutes >=
              booking.start &&
            minutes <
              booking.end
          );

        }
      );

    }


    /* =====================================================
       POPULATE START TIMES
       ===================================================== */

    function populateStartTimes() {

      startTime.innerHTML =
        '<option value="">Select start time</option>';


      if (
        !selectedFacility
      ) {

        return;

      }


      const opening =
        timeToMinutes(
          normalizeTime(
            selectedFacility.openingTime
          )
        );


      const closing =
        timeToMinutes(
          normalizeTime(
            selectedFacility.closingTime
          )
        );


      if (
        opening === null ||
        closing === null
      ) {

        return;

      }


      for (
        let minutes = opening;
        minutes < closing;
        minutes += SLOT_INTERVAL
      ) {

        /*
           A start time is selectable only if
           the first 30-minute interval is free.
        */

        if (
          isIntervalAvailable(
            minutes,
            minutes + MIN_DURATION
          )
        ) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            String(
              minutes
            );


          option.textContent =
            minutesToDisplayTime(
              minutes
            );


          startTime.appendChild(
            option
          );

        }

      }

    }


    /* =====================================================
       SELECT START TIME
       ===================================================== */

    function selectStartTime(
      minutes
    ) {

      selectedStartTime =
        minutes;


      startTime.value =
        String(
          minutes
        );


      updateSelectedSlot();


      populateDurations();


      updateEndTime();

    }


    /* =====================================================
       HANDLE START TIME CHANGE
       ===================================================== */

    function handleStartTimeChange() {

      if (
        !startTime.value
      ) {

        selectedStartTime =
          null;

        selectedEndTime =
          null;

        duration.innerHTML =
          '<option value="">Select duration</option>';

        duration.disabled =
          true;

        endTime.value =
          "";

        continueButton.disabled =
          true;

        updateSelectedSlot();

        return;

      }


      selectedStartTime =
        parseInt(
          startTime.value,
          10
        );


      populateDurations();


      updateEndTime();


      updateSelectedSlot();

    }


    /* =====================================================
       POPULATE DURATIONS
       ===================================================== */

    function populateDurations() {

      duration.innerHTML =
        '<option value="">Select duration</option>';


      duration.disabled =
        true;


      selectedEndTime =
        null;


      endTime.value =
        "";


      continueButton.disabled =
        true;


      if (
        selectedStartTime === null
      ) {

        return;

      }


      const closing =
        timeToMinutes(
          normalizeTime(
            selectedFacility.closingTime
          )
        );


      if (
        closing === null
      ) {

        return;

      }


      const options = [];


      for (
        let minutes =
          MIN_DURATION;

        minutes <=
          MAX_DURATION;

        minutes +=
          SLOT_INTERVAL

      ) {

        const proposedEnd =
          selectedStartTime +
          minutes;


        if (
          proposedEnd >
          closing
        ) {

          break;

        }


        if (
          isIntervalAvailable(
            selectedStartTime,
            proposedEnd
          )
        ) {

          options.push(
            minutes
          );

        } else {

          /*
             Once an interval is blocked,
             longer durations will also
             be blocked.
          */

          break;

        }

      }


      options.forEach(
        function(minutes) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            String(
              minutes
            );


          option.textContent =
            formatDuration(
              minutes
            );


          duration.appendChild(
            option
          );

        }
      );


      if (
        options.length > 0
      ) {

        duration.disabled =
          false;

      }

    }


    /* =====================================================
       UPDATE END TIME
       ===================================================== */

    function updateEndTime() {

      if (
        selectedStartTime === null ||
        isNaN(
          parseInt(
            duration.value,
            10
          )
        )
      ) {

        selectedEndTime =
          null;

        endTime.value =
          "";

        continueButton.disabled =
          true;

        return;

      }


      const selectedDuration =
        parseInt(
          duration.value,
          10
        );


      selectedEndTime =
        selectedStartTime +
        selectedDuration;


      endTime.value =
        minutesToDisplayTime(
          selectedEndTime
        );


      continueButton.disabled =
        !isIntervalAvailable(
          selectedStartTime,
          selectedEndTime
        );


      updateSelectedSlot();

    }


    /* =====================================================
       CHECK INTERVAL AVAILABILITY
       ===================================================== */

    function isIntervalAvailable(
      start,
      end
    ) {

      if (
        start === null ||
        end === null
      ) {

        return false;

      }


      if (
        end <= start
      ) {

        return false;

      }


      return !currentBookings.some(
        function(booking) {

          return (

            start <
            booking.end &&

            end >
            booking.start

          );

        }
      );

    }


    /* =====================================================
       UPDATE SELECTED SLOT
       ===================================================== */

    function updateSelectedSlot() {

      const slots =
        availabilityGrid.querySelectorAll(
          ".slot"
        );


      slots.forEach(
        function(slot) {

          slot.classList.remove(
            "selected"
          );

        }
      );


      if (
        selectedStartTime === null
      ) {

        return;

      }


      const target =
        minutesToDisplayTime(
          selectedStartTime
        );


      slots.forEach(
        function(slot) {

          if (
            slot.textContent
              .startsWith(
                target
              ) &&
            !slot.classList.contains(
              "booked"
            ) &&
            !slot.classList.contains(
              "pending"
            )
          ) {

            slot.classList.add(
              "selected"
            );

          }

        }
      );

    }


    /* =====================================================
       CONTINUE TO GOOGLE FORM
       ===================================================== */

    function continueToForm() {

      if (
        !selectedFacility ||
        selectedFacility.status !==
        "ACTIVE"
      ) {

        return;

      }


      if (
        !selectedDate
      ) {

        alert(
          "Please select a booking date."
        );

        return;

      }


      if (
        selectedStartTime === null
      ) {

        alert(
          "Please select a start time."
        );

        return;

      }


      if (
        selectedEndTime === null
      ) {

        alert(
          "Please select a duration."
        );

        return;

      }


      if (
        !isIntervalAvailable(
          selectedStartTime,
          selectedEndTime
        )
      ) {

        alert(
          "The selected time is no longer available. Please choose another time."
        );

        return;

      }


      const start =
        minutesToFormTime(
          selectedStartTime
        );


      const end =
        minutesToFormTime(
          selectedEndTime
        );


      /*
         Google Forms Date question:
         YYYY-MM-DD
      */

      const formDate =
        selectedDate;


      const params =
        new URLSearchParams();


      params.set(
        FORM_FIELDS.facility,
        selectedFacility.facility
      );


      params.set(
        FORM_FIELDS.date,
        formDate
      );


      params.set(
        FORM_FIELDS.start,
        start
      );


      params.set(
        FORM_FIELDS.end,
        end
      );


      const url =
        GOOGLE_FORM_URL +
        "?" +
        params.toString();


      window.open(
        url,
        "_blank"
      );

    }


    /* =====================================================
       TIME HELPERS
       ===================================================== */

    function normalizeTime(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "";

      }


      let text =
        String(
          value
        ).trim();


      /*
         Handle GViz / Sheets values such as:

         08:00
         08:00:00
         8:00 AM
         8:00 PM
      */

      text =
        text
          .replace(
            /\s+/g,
            " "
          );


      const match =
        text.match(
          /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i
        );


      if (!match) {

        return text;

      }


      let hours =
        parseInt(
          match[1],
          10
        );


      const minutes =
        parseInt(
          match[2],
          10
        );


      const ampm =
        match[4];


      if (
        ampm
      ) {

        const upper =
          ampm.toUpperCase();


        if (
          upper === "PM" &&
          hours !== 12
        ) {

          hours += 12;

        }


        if (
          upper === "AM" &&
          hours === 12
        ) {

          hours = 0;

        }

      }


      return (
        String(
          hours
        ).padStart(
          2,
          "0"
        ) +
        ":" +
        String(
          minutes
        ).padStart(
          2,
          "0"
        )
      );

    }


    function timeToMinutes(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return null;

      }


      const normalized =
        normalizeTime(
          value
        );


      const match =
        normalized.match(
          /^(\d{2}):(\d{2})$/
        );


      if (!match) {

        return null;

      }


      const hours =
        parseInt(
          match[1],
          10
        );


      const minutes =
        parseInt(
          match[2],
          10
        );


      if (
        hours < 0 ||
        hours > 23 ||
        minutes < 0 ||
        minutes > 59
      ) {

        return null;

      }


      return (
        hours * 60 +
        minutes
      );

    }


    function minutesToDisplayTime(
      minutes
    ) {

      const hours =
        Math.floor(
          minutes / 60
        );


      const mins =
        minutes % 60;


      return (
        String(
          hours
        ).padStart(
          2,
          "0"
        ) +
        ":" +
        String(
          mins
        ).padStart(
          2,
          "0"
        )
      );

    }


    function minutesToFormTime(
      minutes
    ) {

      const hours =
        Math.floor(
          minutes / 60
        );


      const mins =
        minutes % 60;


      return (
        String(
          hours
        ).padStart(
          2,
          "0"
        ) +
        ":" +
        String(
          mins
        ).padStart(
          2,
          "0"
        )
      );

    }


    function formatDisplayTime(
      value
    ) {

      const minutes =
        timeToMinutes(
          value
        );


      if (
        minutes === null
      ) {

        return value || "";

      }


      return minutesToDisplayTime(
        minutes
      );

    }


    function formatDuration(
      minutes
    ) {

      const hours =
        Math.floor(
          minutes / 60
        );


      const mins =
        minutes % 60;


      if (
        hours === 0
      ) {

        return (
          minutes +
          " minutes"
        );

      }


      if (
        mins === 0
      ) {

        return (
          hours +
          (
            hours === 1
              ? " hour"
              : " hours"
          )
        );

      }


      return (
        hours +
        (
          hours === 1
            ? " hour "
            : " hours "
        ) +
        mins +
        " minutes"
      );

    }


    /* =====================================================
       DATE HELPERS
       ===================================================== */

    function normalizeDate(
      value
    ) {

      if (
        !value
      ) {

        return "";

      }


      const text =
        String(
          value
        ).trim();


      /*
         Already YYYY-MM-DD
      */

      if (
        /^\d{4}-\d{2}-\d{2}$/
          .test(
            text
          )
      ) {

        return text;

      }


      /*
         Handle common GViz display:

         2026-10-09
         09/10/2026
         09-10-2026
      */

      let match =
        text.match(
          /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/
        );


      if (match) {

        return (

          match[1] +
          "-" +
          String(
            match[2]
          ).padStart(
            2,
            "0"
          ) +
          "-" +
          String(
            match[3]
          ).padStart(
            2,
            "0"
          )

        );

      }


      match =
        text.match(
          /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/
        );


      if (match) {

        return (

          match[3] +
          "-" +
          String(
            match[2]
          ).padStart(
            2,
            "0"
          ) +
          "-" +
          String(
            match[1]
          ).padStart(
            2,
            "0"
          )

        );

      }


      return text;

    }


    /* =====================================================
       ERROR HANDLING
       ===================================================== */

    function showError(
      message
    ) {

      errorMessage.textContent =
        message;


      errorMessage.classList.remove(
        "hidden"
      );

    }


    function hideError() {

      errorMessage.classList.add(
        "hidden"
      );

      errorMessage.textContent =
        "";

    }

  </script>
