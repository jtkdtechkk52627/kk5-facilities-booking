<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KK5 Facility Booking</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    header {
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #6b7280;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .facility-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .facility-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .facility-card:hover {
      transform: translateY(-2px);
      border-color: #9ca3af;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .facility-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .facility-card p {
      margin: 4px 0;
      color: #6b7280;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 17px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary-btn {
      background: #111827;
      color: white;
    }

    .primary-btn:hover {
      background: #374151;
    }

    .secondary-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary-btn:hover {
      background: #d1d5db;
    }

    .back-btn {
      margin-bottom: 20px;
    }

    .facility-header {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
    }

    .facility-header h2 {
      margin: 0 0 10px;
    }

    .facility-header p {
      margin: 5px 0;
      color: #6b7280;
    }

    .date-section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .date-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="text"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    input[readonly] {
      background: #f9fafb;
      color: #6b7280;
    }

    .availability-section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
    }

    .availability-section h3 {
      margin-top: 0;
    }

    .loading {
      color: #6b7280;
      padding: 20px 0;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 9px;
      margin-top: 15px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .slot {
      padding: 13px 8px;
      border-radius: 9px;
      text-align: center;
      font-size: 13px;
      border: 1px solid #d1d5db;
    }

    .slot.available {
      background: #ecfdf5;
      border-color: #86efac;
      color: #166534;
      cursor: pointer;
    }

    .slot.available:hover {
      background: #dcfce7;
    }

    .slot.pending {
      background: #fef3c7;
      border-color: #fcd34d;
      color: #92400e;
      cursor: not-allowed;
    }

    .slot.booked {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
      cursor: not-allowed;
    }

    .slot.selected {
      outline: 3px solid #111827;
    }

    .booking-controls {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .continue-btn {
      width: 100%;
      margin-top: 10px;
    }

    .continue-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    .legend-available {
      background: #86efac;
    }

    .legend-pending {
      background: #fcd34d;
    }

    .legend-booked {
      background: #fca5a5;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 15px 40px;
      }

      header h1 {
        font-size: 26px;
      }

      .facility-grid {
        grid-template-columns: 1fr;
      }

      .slot-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =========================
       HOME PAGE
  ========================== -->

  <div id="homePage" class="page active">

    <header>
      <h1>KK5 Facility Booking</h1>
      <p>Select a facility to view its availability.</p>
    </header>

    <div id="facilityLoading" class="loading">
      Loading facilities...
    </div>

    <div
      id="facilityError"
      class="error"
      style="display:none;">
    </div>

    <div
      id="facilityGrid"
      class="facility-grid">
    </div>

  </div>


  <!-- =========================
       FACILITY PAGE
  ========================== -->

  <div id="facilityPage" class="page">

    <button
      class="secondary-btn back-btn"
      onclick="goHome()">
      ← Back to Facilities
    </button>

    <div class="facility-header">

      <h2 id="selectedFacilityName">
        Facility
      </h2>

      <p id="selectedFacilityHours">
        Operating hours
      </p>

    </div>


    <!-- DATE -->

    <div class="date-section">

      <label for="bookingDate">
        Select Date
      </label>

      <input
        type="date"
        id="bookingDate"
        onchange="loadAvailability()">

    </div>


    <!-- AVAILABILITY -->

    <div class="availability-section">

      <h3>
        Availability
      </h3>

      <div
        id="availabilityLoading"
        class="loading">
        Select a date to view availability.
      </div>

      <div
        id="availabilityError"
        class="error"
        style="display:none;">
      </div>

      <div
        id="slotGrid"
        class="slot-grid">
      </div>


      <!-- LEGEND -->

      <div class="legend">

        <div class="legend-item">
          <div class="legend-box legend-available"></div>
          Available
        </div>

        <div class="legend-item">
          <div class="legend-box legend-pending"></div>
          Pending
        </div>

        <div class="legend-item">
          <div class="legend-box legend-booked"></div>
          Booked
        </div>

      </div>


      <!-- BOOKING CONTROLS -->

      <div class="booking-controls">

        <div class="control-group">

          <label for="startTime">
            Start Time
          </label>

          <select
            id="startTime"
            onchange="updateDurationOptions()">

            <option value="">
              Select start time
            </option>

          </select>

        </div>


        <div class="control-group">

          <label for="duration">
            Duration
          </label>

          <select
            id="duration"
            onchange="updateEndTime()">

            <option value="">
              Select duration
            </option>

          </select>

        </div>


        <div class="control-group">

          <label for="endTime">
            End Time
          </label>

          <input
            type="text"
            id="endTime"
            readonly
            placeholder="Automatically calculated">

        </div>


        <button
          id="continueBtn"
          class="primary-btn continue-btn"
          disabled
          onclick="continueToForm()">

          Continue to Booking Form

        </button>

      </div>

    </div>

  </div>

</div>


<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const PUBLIC_SHEET_ID =
  "1PGb7g244LFMQlqJdJWDGaeGsZzJsel9WTUakDcNatiQ";

const FACILITIES_SHEET =
  "Facilities";

const BOOKINGS_SHEET =
  "Bookings";

const GOOGLE_FORM_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSdja_U2aFCea0GAL6qZdaUxG5viyi4AlC-zROude_yzXAFIWg/viewform";


/*
  Google Form prefilled field IDs
*/

const FORM_FIELDS = {

  facility:
    "entry.1139525746",

  date:
    "entry.482205338",

  start:
    "entry.1117912077",

  end:
    "entry.866972168"

};


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let facilities = [];

let bookings = [];

let selectedFacility = null;

let selectedDate = null;

let selectedStartTime = null;

let selectedEndTime = null;


/* =========================================================
   PAGE INITIALIZATION
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    setMinimumDate();

    loadFacilities();

  }
);


/* =========================================================
   DATE FUNCTIONS
========================================================= */

function setMinimumDate() {

  const input =
    document.getElementById(
      "bookingDate"
    );

  const today =
    new Date();

  input.min =
    formatDateForInput(
      today
    );

}


function formatDateForInput(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================================================
   GOOGLE SHEETS GVIZ FETCH
========================================================= */

async function fetchGviz(sheetName) {

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    PUBLIC_SHEET_ID +
    "/gviz/tq" +
    "?sheet=" +
    encodeURIComponent(sheetName) +
    "&tqx=out:json";

  try {

    const response =
      await fetch(
        url,
        {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        }
      );

    const text =
      await response.text();

    console.log(
      "GViz response:",
      response.status,
      text.substring(
        0,
        300
      )
    );

    if (!response.ok) {

      throw new Error(
        "Google Sheet returned HTTP " +
        response.status
      );

    }

    const start =
      text.indexOf("(");

    const end =
      text.lastIndexOf(")");

    if (
      start === -1 ||
      end === -1
    ) {

      throw new Error(
        "Google Sheet returned an invalid Gviz response."
      );

    }

    const jsonText =
      text.substring(
        start + 1,
        end
      );

    return JSON.parse(
      jsonText
    );

  }

  catch (error) {

    console.error(
      "GViz fetch failed:",
      error
    );

    throw error;

  }

}


/* =========================================================
   GOOGLE SHEET CELL HELPER
========================================================= */

function getCellValue(cell) {

  if (!cell) {
    return "";
  }

  if (
    cell.f !== undefined &&
    cell.f !== null
  ) {

    return String(
      cell.f
    ).trim();

  }

  if (
    cell.v !== undefined &&
    cell.v !== null
  ) {

    return String(
      cell.v
    ).trim();

  }

  return "";

}


/* =========================================================
   LOAD FACILITIES
========================================================= */

async function loadFacilities() {

  const loading =
    document.getElementById(
      "facilityLoading"
    );

  const error =
    document.getElementById(
      "facilityError"
    );

  const grid =
    document.getElementById(
      "facilityGrid"
    );

  loading.style.display =
    "block";

  error.style.display =
    "none";

  grid.innerHTML =
    "";

  try {

    const data =
      await fetchGviz(
        FACILITIES_SHEET
      );

    facilities =
      parseFacilities(
        data.table
      );

    if (
      facilities.length === 0
    ) {

      throw new Error(
        "No facilities were found in the public Facilities sheet."
      );

    }

    renderFacilities();

    loading.style.display =
      "none";

  }

  catch (err) {

    console.error(
      "Facility loading error:",
      err
    );

    loading.style.display =
      "none";

    error.textContent =
      "Failed to load facilities. " +
      err.message;

    error.style.display =
      "block";

  }

}


/* =========================================================
   PARSE FACILITIES
========================================================= */

function parseFacilities(table) {

  const result = [];

  if (
    !table ||
    !table.rows
  ) {

    return result;

  }

  table.rows.forEach(
    row => {

      if (
        !row ||
        !row.c
      ) {

        return;

      }

      /*
        Public Facilities structure:

        Column A = Facility
        Column B = Opening Time
        Column C = Closing Time
      */

      const facility =
        getCellValue(
          row.c[0]
        );

      const openingRaw =
        getCellValue(
          row.c[1]
        );

      const closingRaw =
        getCellValue(
          row.c[2]
        );


      /*
        Ignore header
      */

      if (
        !facility ||
        facility.toLowerCase() ===
        "facility"
      ) {

        return;

      }


      const openingTime =
        normalizeTime(
          openingRaw
        );

      const closingTime =
        normalizeTime(
          closingRaw
        );


      if (
        !openingTime ||
        !closingTime
      ) {

        console.warn(
          "Skipping facility because time is invalid:",
          facility,
          openingRaw,
          closingRaw
        );

        return;

      }


      result.push({

        facility:
          facility,

        openingTime:
          openingTime,

        closingTime:
          closingTime

      });

    }
  );

  return result;

}


/* =========================================================
   RENDER FACILITIES
========================================================= */

function renderFacilities() {

  const grid =
    document.getElementById(
      "facilityGrid"
    );

  grid.innerHTML =
    "";

  facilities.forEach(
    facility => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "facility-card";

      card.innerHTML = `

        <h3>
          ${escapeHtml(
            facility.facility
          )}
        </h3>

        <p>
          🕐 ${formatTime(
            facility.openingTime
          )}
          –
          ${formatTime(
            facility.closingTime
          )}
        </p>

        <p>
          Click to view availability →
        </p>

      `;

      card.onclick =
        () => openFacility(
          facility
        );

      grid.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   OPEN FACILITY
========================================================= */

function openFacility(facility) {

  selectedFacility =
    facility;

  selectedDate =
    null;

  selectedStartTime =
    null;

  selectedEndTime =
    null;


  document
    .getElementById(
      "homePage"
    )
    .classList
    .remove(
      "active"
    );


  document
    .getElementById(
      "facilityPage"
    )
    .classList
    .add(
      "active"
    );


  document
    .getElementById(
      "selectedFacilityName"
    )
    .textContent =
    facility.facility;


  document
    .getElementById(
      "selectedFacilityHours"
    )
    .textContent =
      "Opening hours: " +
      formatTime(
        facility.openingTime
      ) +
      " – " +
      formatTime(
        facility.closingTime
      );


  const dateInput =
    document.getElementById(
      "bookingDate"
    );

  dateInput.value =
    "";


  document
    .getElementById(
      "slotGrid"
    )
    .innerHTML =
    "";


  document
    .getElementById(
      "availabilityLoading"
    )
    .textContent =
    "Select a date to view availability.";


  document
    .getElementById(
      "availabilityLoading"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "availabilityError"
    )
    .style.display =
    "none";


  resetBookingControls();

}


/* =========================================================
   GO HOME
========================================================= */

function goHome() {

  selectedFacility =
    null;

  selectedDate =
    null;

  selectedStartTime =
    null;

  selectedEndTime =
    null;


  document
    .getElementById(
      "facilityPage"
    )
    .classList
    .remove(
      "active"
    );


  document
    .getElementById(
      "homePage"
    )
    .classList
    .add(
      "active"
    );

}


/* =========================================================
   LOAD AVAILABILITY
========================================================= */

async function loadAvailability() {

  if (
    !selectedFacility
  ) {

    return;

  }


  const dateInput =
    document.getElementById(
      "bookingDate"
    );

  const date =
    dateInput.value;


  if (!date) {

    return;

  }


  selectedDate =
    date;


  const loading =
    document.getElementById(
      "availabilityLoading"
    );

  const error =
    document.getElementById(
      "availabilityError"
    );

  const slotGrid =
    document.getElementById(
      "slotGrid"
    );


  loading.style.display =
    "block";

  loading.textContent =
    "Loading availability...";


  error.style.display =
    "none";


  slotGrid.innerHTML =
    "";


  resetBookingControls();


  try {

    const data =
      await fetchGviz(
        BOOKINGS_SHEET
      );

    bookings =
      parseBookings(
        data.table
      );

    renderAvailability();

    loading.style.display =
      "none";

  }

  catch (err) {

    console.error(
      "Availability error:",
      err
    );

    loading.style.display =
      "none";

    error.textContent =
      "Failed to load availability. " +
      err.message;

    error.style.display =
      "block";

  }

}


/* =========================================================
   PARSE BOOKINGS
========================================================= */

function parseBookings(table) {

  const result = [];

  if (
    !table ||
    !table.rows
  ) {

    return result;

  }


  table.rows.forEach(
    row => {

      if (
        !row ||
        !row.c
      ) {

        return;

      }


      /*
        Public Bookings structure:

        Column A = Facility
        Column B = Date
        Column C = Start
        Column D = End
        Column E = Status
      */

      const facility =
        getCellValue(
          row.c[0]
        );

      const dateRaw =
        getCellValue(
          row.c[1]
        );

      const startRaw =
        getCellValue(
          row.c[2]
        );

      const endRaw =
        getCellValue(
          row.c[3]
        );

      const status =
        getCellValue(
          row.c[4]
        ).toUpperCase();


      /*
        Ignore header
      */

      if (
        !facility ||
        facility.toLowerCase() ===
        "facility"
      ) {

        return;

      }


      /*
        Only PENDING and APPROVED
        affect availability.
      */

      if (
        status !== "PENDING" &&
        status !== "APPROVED"
      ) {

        return;

      }


      const date =
        normalizeDate(
          dateRaw
        );

      const start =
        normalizeTime(
          startRaw
        );

      const end =
        normalizeTime(
          endRaw
        );


      if (
        !date ||
        !start ||
        !end
      ) {

        console.warn(
          "Skipping invalid booking:",
          facility,
          dateRaw,
          startRaw,
          endRaw,
          status
        );

        return;

      }


      result.push({

        facility:
          facility,

        date:
          date,

        start:
          start,

        end:
          end,

        status:
          status

      });

    }
  );


  return result;

}


/* =========================================================
   RENDER AVAILABILITY
========================================================= */

function renderAvailability() {

  const slotGrid =
    document.getElementById(
      "slotGrid"
    );

  slotGrid.innerHTML =
    "";


  const openMinutes =
    timeToMinutes(
      selectedFacility.openingTime
    );

  const closeMinutes =
    timeToMinutes(
      selectedFacility.closingTime
    );


  /*
    Create 30-minute slots.
  */

  for (
    let minutes = openMinutes;
    minutes < closeMinutes;
    minutes += 30
  ) {

    const slotStart =
      minutes;

    const slotEnd =
      minutes + 30;


    if (
      slotEnd > closeMinutes
    ) {

      break;

    }


    const status =
      getSlotStatus(
        selectedFacility.facility,
        selectedDate,
        slotStart,
        slotEnd
      );


    const slot =
      document.createElement(
        "div"
      );

    slot.className =
      "slot " +
      status;


    slot.textContent =
      `${formatMinutes(
        slotStart
      )} – ${formatMinutes(
        slotEnd
      )}`;


    if (
      status === "available"
    ) {

      slot.onclick =
        () => selectSlot(
          slotStart,
          slot
        );

    }


    slotGrid.appendChild(
      slot
    );

  }

}


/* =========================================================
   SLOT STATUS
========================================================= */

function getSlotStatus(
  facility,
  date,
  slotStart,
  slotEnd
) {

  const matchingBookings =
    bookings.filter(
      booking => {

        return (

          booking.facility ===
            facility &&

          booking.date ===
            date &&

          intervalsOverlap(
            slotStart,
            slotEnd,
            timeToMinutes(
              booking.start
            ),
            timeToMinutes(
              booking.end
            )

          )

        );

      }
    );


  /*
    Approved takes priority.
  */

  if (
    matchingBookings.some(
      booking =>
        booking.status ===
        "APPROVED"
    )
  ) {

    return "booked";

  }


  if (
    matchingBookings.some(
      booking =>
        booking.status ===
        "PENDING"
    )
  ) {

    return "pending";

  }


  return "available";

}


/* =========================================================
   INTERVAL OVERLAP
========================================================= */

function intervalsOverlap(
  startA,
  endA,
  startB,
  endB
) {

  return (

    startA < endB &&
    endA > startB

  );

}


/* =========================================================
   SELECT SLOT
========================================================= */

function selectSlot(
  minutes,
  element
) {

  document
    .querySelectorAll(
      ".slot.selected"
    )
    .forEach(
      slot =>
        slot.classList.remove(
          "selected"
        )
    );


  element.classList.add(
    "selected"
  );


  selectedStartTime =
    minutes;

  selectedEndTime =
    null;


  const startSelect =
    document.getElementById(
      "startTime"
    );


  startSelect.value =
    minutes;


  updateDurationOptions();

}


/* =========================================================
   UPDATE DURATION OPTIONS
========================================================= */

function updateDurationOptions() {

  const durationSelect =
    document.getElementById(
      "duration"
    );

  const endInput =
    document.getElementById(
      "endTime"
    );

  const continueBtn =
    document.getElementById(
      "continueBtn"
    );


  durationSelect.innerHTML = `

    <option value="">
      Select duration
    </option>

  `;


  endInput.value =
    "";


  continueBtn.disabled =
    true;


  const start =
    parseInt(
      document.getElementById(
        "startTime"
      ).value
    );


  if (
    isNaN(start)
  ) {

    selectedStartTime =
      null;

    selectedEndTime =
      null;

    return;

  }


  selectedStartTime =
    start;


  const closing =
    timeToMinutes(
      selectedFacility.closingTime
    );


  /*
    Maximum duration is 4 hours.
  */

  const maxDuration =
    Math.min(
      240,
      closing - start
    );


  for (
    let duration = 30;
    duration <= maxDuration;
    duration += 30
  ) {

    const end =
      start +
      duration;


    if (
      isEntireIntervalAvailable(
        start,
        end
      )
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        duration;


      option.textContent =
        formatDuration(
          duration
        );


      durationSelect.appendChild(
        option
      );

    }

  }

}


/* =========================================================
   CHECK WHOLE INTERVAL
========================================================= */

function isEntireIntervalAvailable(
  start,
  end
) {

  return !bookings.some(
    booking => {

      if (
        booking.facility !==
        selectedFacility.facility
      ) {

        return false;

      }


      if (
        booking.date !==
        selectedDate
      ) {

        return false;

      }


      const bookingStart =
        timeToMinutes(
          booking.start
        );

      const bookingEnd =
        timeToMinutes(
          booking.end
        );


      return intervalsOverlap(
        start,
        end,
        bookingStart,
        bookingEnd
      );

    }
  );

}


/* =========================================================
   UPDATE END TIME
========================================================= */

function updateEndTime() {

  const duration =
    parseInt(
      document.getElementById(
        "duration"
      ).value
    );


  const endInput =
    document.getElementById(
      "endTime"
    );


  const continueBtn =
    document.getElementById(
      "continueBtn"
    );


  /*
    IMPORTANT:

    Do not use !selectedStartTime here.

    Midnight = 0,
    and 0 is considered false in JavaScript.

    So we specifically check for null.
  */

  if (
    selectedStartTime === null ||
    isNaN(duration)
  ) {

    endInput.value =
      "";

    continueBtn.disabled =
      true;

    return;

  }


  const end =
    selectedStartTime +
    duration;


  if (
    !isEntireIntervalAvailable(
      selectedStartTime,
      end
    )
  ) {

    endInput.value =
      "";

    continueBtn.disabled =
      true;

    return;

  }


  selectedEndTime =
    end;


  endInput.value =
    formatMinutes(
      end
    );


  continueBtn.disabled =
    false;

}


/* =========================================================
   RESET BOOKING CONTROLS
========================================================= */

function resetBookingControls() {

  document.getElementById(
    "startTime"
  ).innerHTML = `

    <option value="">
      Select start time
    </option>

  `;


  document.getElementById(
    "duration"
  ).innerHTML = `

    <option value="">
      Select duration
    </option>

  `;


  document.getElementById(
    "endTime"
  ).value =
    "";


  document.getElementById(
    "continueBtn"
  ).disabled =
    true;


  selectedStartTime =
    null;

  selectedEndTime =
    null;


  if (
    selectedFacility
  ) {

    const startSelect =
      document.getElementById(
        "startTime"
      );


    const open =
      timeToMinutes(
        selectedFacility.openingTime
      );


    const close =
      timeToMinutes(
        selectedFacility.closingTime
      );


    /*
      Generate start times every 30 minutes.
    */

    for (
      let time = open;
      time < close;
      time += 30
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        time;


      option.textContent =
        formatMinutes(
          time
        );


      startSelect.appendChild(
        option
      );

    }

  }

}


/* =========================================================
   CONVERT MINUTES TO GOOGLE FORM TIME
========================================================= */

/*
  IMPORTANT:

  Website display:
      8:00 AM

  Google Form Time field:
      08:00

  Therefore we use this function ONLY
  when sending the value to Google Forms.
*/

function minutesToFormTime(minutes) {

  const hours =
    Math.floor(
      minutes / 60
    );

  const mins =
    minutes % 60;


  return (

    String(hours)
      .padStart(
        2,
        "0"
      ) +

    ":" +

    String(mins)
      .padStart(
        2,
        "0"
      )

  );

}


/* =========================================================
   CONTINUE TO GOOGLE FORM
========================================================= */

function continueToForm() {

  if (
    !selectedFacility ||
    !selectedDate ||
    selectedStartTime === null ||
    selectedEndTime === null
  ) {

    alert(
      "Please select a facility, date, start time and duration."
    );

    return;

  }


  /*
    Final availability check before
    opening the form.
  */

  if (
    !isEntireIntervalAvailable(
      selectedStartTime,
      selectedEndTime
    )
  ) {

    alert(
      "Sorry, this time is no longer available. Please choose another slot."
    );


    loadAvailability();

    return;

  }


  /*
    IMPORTANT:

    Convert the selected times to
    24-hour HH:MM format.

    Example:

    8:00 AM  → 08:00
    2:30 PM  → 14:30
  */

  const start =
    minutesToFormTime(
      selectedStartTime
    );


  const end =
    minutesToFormTime(
      selectedEndTime
    );


  /*
    Date input already gives:

    YYYY-MM-DD

    so we keep it exactly as it is.
  */

  const formDate =
    selectedDate;


  const params =
    new URLSearchParams();


  params.set(
    FORM_FIELDS.facility,
    selectedFacility.facility
  );


  params.set(
    FORM_FIELDS.date,
    formDate
  );


  params.set(
    FORM_FIELDS.start,
    start
  );


  params.set(
    FORM_FIELDS.end,
    end
  );


  const url =
    GOOGLE_FORM_URL +
    "?" +
    params.toString();


  console.log(
    "Opening Google Form:",
    url
  );


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";

  }


  let text =
    String(value)
      .trim();


  /*
    Google Sheets date/time object
  */

  const dateMatch =
    text.match(
      /Date\(\d+,\s*\d+,\s*\d+,\s*(\d+),\s*(\d+)(?:,\s*(\d+))?/
    );


  if (
    dateMatch
  ) {

    const hours =
      parseInt(
        dateMatch[1]
      );


    const minutes =
      parseInt(
        dateMatch[2]
      );


    return minutesToTime(
      hours * 60 +
      minutes
    );

  }


  /*
    24-hour format:

    08:00
    14:30
  */

  let match =
    text.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );


  if (
    match
  ) {

    const hours =
      parseInt(
        match[1]
      );


    const minutes =
      parseInt(
        match[2]
      );


    if (
      hours >= 0 &&
      hours <= 23 &&
      minutes >= 0 &&
      minutes <= 59
    ) {

      return minutesToTime(
        hours * 60 +
        minutes
      );

    }

  }


  /*
    12-hour format:

    8:00 AM
    2:30 PM
  */

  match =
    text.match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
    );


  if (
    match
  ) {

    let hours =
      parseInt(
        match[1]
      );


    const minutes =
      parseInt(
        match[2]
      );


    const period =
      match[3].toUpperCase();


    if (
      hours >= 1 &&
      hours <= 12 &&
      minutes >= 0 &&
      minutes <= 59
    ) {

      if (
        period === "AM"
      ) {

        if (
          hours === 12
        ) {

          hours = 0;

        }

      }

      else {

        if (
          hours !== 12
        ) {

          hours += 12;

        }

      }


      return minutesToTime(
        hours * 60 +
        minutes
      );

    }

  }


  /*
    Google Sheets sometimes returns
    time as a decimal fraction.

    Example:

    0.5 = 12:00 PM
  */

  const numeric =
    Number(text);


  if (
    !isNaN(numeric) &&
    numeric >= 0 &&
    numeric < 1
  ) {

    const totalMinutes =
      Math.round(
        numeric *
        24 *
        60
      );


    return minutesToTime(
      totalMinutes
    );

  }


  console.warn(
    "Could not normalize time:",
    value
  );


  return "";

}


/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDate(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "";

  }


  let text =
    String(value)
      .trim();


  /*
    Google Sheets Date object
  */

  const dateMatch =
    text.match(
      /Date\((\d+),\s*(\d+),\s*(\d+)/
    );


  if (
    dateMatch
  ) {

    const year =
      parseInt(
        dateMatch[1]
      );


    const month =
      parseInt(
        dateMatch[2]
      ) + 1;


    const day =
      parseInt(
        dateMatch[3]
      );


    return (

      year +
      "-" +
      String(month)
        .padStart(
          2,
          "0"
        ) +
      "-" +
      String(day)
        .padStart(
          2,
          "0"
        )

    );

  }


  /*
    Already YYYY-MM-DD
  */

  if (
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ) {

    return text;

  }


  /*
    DD/MM/YYYY
  */

  let match =
    text.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


  if (
    match
  ) {

    const day =
      parseInt(
        match[1]
      );


    const month =
      parseInt(
        match[2]
      );


    const year =
      parseInt(
        match[3]
      );


    return (

      year +
      "-" +
      String(month)
        .padStart(
          2,
          "0"
        ) +
      "-" +
      String(day)
        .padStart(
          2,
          "0"
        )

    );

  }


  /*
    Try normal JavaScript date parsing.
  */

  const parsed =
    new Date(text);


  if (
    !isNaN(
      parsed.getTime()
    )
  ) {

    return formatDateForInput(
      parsed
    );

  }


  return "";

}


/* =========================================================
   TIME → MINUTES
========================================================= */

function timeToMinutes(time) {

  if (
    !time
  ) {

    return NaN;

  }


  const parts =
    time.split(":");


  return (

    parseInt(
      parts[0]
    ) *
    60 +

    parseInt(
      parts[1]
    )

  );

}


/* =========================================================
   MINUTES → 24-HOUR TIME
========================================================= */

function minutesToTime(minutes) {

  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    minutes % 60;


  return (

    String(hours)
      .padStart(
        2,
        "0"
      ) +

    ":" +

    String(mins)
      .padStart(
        2,
        "0"
      )

  );

}


/* =========================================================
   MINUTES → DISPLAY TIME
========================================================= */

function formatMinutes(minutes) {

  let hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    minutes % 60;


  const period =
    hours >= 12
      ? "PM"
      : "AM";


  if (
    hours === 0
  ) {

    hours = 12;

  }

  else if (
    hours > 12
  ) {

    hours -= 12;

  }


  return (

    hours +
    ":" +
    String(mins)
      .padStart(
        2,
        "0"
      ) +
    " " +
    period

  );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(time) {

  const minutes =
    timeToMinutes(
      time
    );


  if (
    isNaN(minutes)
  ) {

    return "Invalid time";

  }


  return formatMinutes(
    minutes
  );

}


/* =========================================================
   FORMAT DURATION
========================================================= */

function formatDuration(minutes) {

  if (
    minutes < 60
  ) {

    return (
      minutes +
      " minutes"
    );

  }


  const hours =
    Math.floor(
      minutes / 60
    );


  const remainder =
    minutes % 60;


  if (
    remainder === 0
  ) {

    return (

      hours +

      (
        hours === 1
          ? " hour"
          : " hours"
      )

    );

  }


  return (

    hours +

    (
      hours === 1
        ? " hour "
        : " hours "
    ) +

    remainder +

    " minutes"

  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
